<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1120" />
  <title>ProPlan — Планирование микроцикла и тренировок</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page:#eef2f6; --bg-mesh:radial-gradient(at 12% 0%,rgba(16,185,129,.09) 0px,transparent 48%),radial-gradient(at 88% 4%,rgba(56,189,248,.08) 0px,transparent 42%);
      --surface:#fff; --surface-soft:#f8fafc; --surface-elev:#f1f5f9; --obsidian:#0b1120; --obsidian-2:#162033;
      --text-main:#0f172a; --text-muted:#334155; --text-subtle:#526071; --text-on-dark:#fff; --text-on-dark-muted:#cbd5e1;
      --accent:#10b981; --accent-dark:#047857; --accent-light:#ecfdf5; --blue:#0284c7; --blue-light:#e0f2fe;
      --amber:#b45309; --amber-light:#fef3c7; --rose:#e11d48; --rose-dark:#be123c; --rose-light:#ffe4e6;
      --violet:#6d28d9; --violet-light:#ede9fe; --border:#e2e8f0; --border-strong:#cbd5e1;
      --radius-sm:8px; --radius-md:13px; --radius-lg:18px;
      --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow-md:0 6px 18px -4px rgba(15,23,42,.08); --shadow-lg:0 22px 44px -10px rgba(15,23,42,.26);
    }
    [data-theme="dark"] {
      --bg-page:#070b14; --surface:#0f172a; --surface-soft:#162033; --surface-elev:#1e293b;
      --text-main:#f8fafc; --text-muted:#cbd5e1; --text-subtle:#94a3b8;
      --border:#263449; --border-strong:#334155; --accent-light:rgba(16,185,129,.15); --accent-dark:#34d399;
      --rose-light:rgba(225,29,72,.18); --amber-light:rgba(217,119,6,.18); --violet-light:rgba(124,58,237,.2); --blue-light:rgba(2,132,199,.18);
    }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
    h1,h2,h3,.brand-title,.doc-title,.kpi-val,.modal-title { font-family:'Plus Jakarta Sans','Inter',sans-serif; }
    body { background-color:var(--bg-page); background-image:var(--bg-mesh); background-attachment:fixed; color:var(--text-main); padding:16px 14px 56px; min-height:100vh; }
    .container { max-width:1580px; margin:0 auto; }
    .tabular { font-variant-numeric:tabular-nums; }
    .hidden { display:none !important; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .btn { background:var(--surface); color:var(--text-main); border:1px solid var(--border-strong); padding:7px 12px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all .14s; box-shadow:var(--shadow-sm); user-select:none; white-space:nowrap; }
    .btn:hover:not(:disabled) { background:var(--surface-elev); border-color:var(--text-subtle); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { background:var(--obsidian); color:#fff; border-color:var(--obsidian); }
    .btn-primary:hover:not(:disabled) { background:var(--obsidian-2); color:#fff; }
    .btn-accent { background:linear-gradient(135deg,#10b981,#059669); color:#fff; border-color:#059669; }
    .btn-accent:hover:not(:disabled) { background:linear-gradient(135deg,#059669,#047857); color:#fff; }
    .btn-danger { background:var(--surface); color:var(--rose); border-color:#fecdd3; }
    .btn-danger:hover:not(:disabled) { background:var(--rose-light); color:var(--rose-dark); }
    .btn-pdf { background:linear-gradient(135deg,#f43f5e,#e11d48); color:#fff; border-color:#e11d48; }
    .btn-pdf:hover:not(:disabled) { background:linear-gradient(135deg,#e11d48,#be123c); color:#fff; }
    .btn-ghost-dark { background:rgba(255,255,255,.1); color:#f8fafc; border:1px solid rgba(255,255,255,.18); box-shadow:none; }
    .btn-ghost-dark:hover:not(:disabled) { background:rgba(255,255,255,.2); color:#fff; }

    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; background:linear-gradient(135deg,var(--obsidian),var(--obsidian-2)); color:#fff; padding:14px 20px; border-radius:var(--radius-lg); border:1px solid rgba(255,255,255,.1); box-shadow:0 12px 28px -6px rgba(11,17,32,.3); }
    .brand-block { display:flex; align-items:center; gap:12px; }
    .brand-logo { width:42px; height:42px; border-radius:11px; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; color:#06281e; flex-shrink:0; }
    .brand-title { font-size:1.22rem; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .brand-badge { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; background:rgba(16,185,129,.18); color:#34d399; padding:2px 8px; border-radius:99px; border:1px solid rgba(52,211,153,.35); }
    .brand-sub { font-size:11.5px; color:var(--text-on-dark-muted); margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:#34d399; display:inline-block; }
    .sync-dot.saving { background:#fbbf24; } .sync-dot.offline { background:#94a3b8; } .sync-dot.conflict { background:#f43f5e; }
    .top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .user-pill { display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); padding:4px 12px 4px 5px; border-radius:99px; cursor:pointer; color:#fff; }
    .user-pill:hover { background:rgba(255,255,255,.18); border-color:#34d399; }
    .user-av { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#10b981,#38bdf8); color:#06281e; font-weight:800; font-size:11.5px; display:flex; align-items:center; justify-content:center; }

    .announce-bar { background:var(--obsidian); color:#fff; border-left:4px solid var(--accent); border-radius:11px; padding:9px 15px; margin-bottom:12px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .tabs-bar { display:flex; flex-wrap:wrap; gap:5px; background:var(--surface); padding:6px; border-radius:14px; border:1px solid var(--border); box-shadow:var(--shadow-sm); margin-bottom:14px; }
    .tab-btn { background:transparent; border:1px solid transparent; border-radius:10px; color:var(--text-muted); padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .14s; }
    .tab-btn:hover { background:var(--surface-elev); color:var(--text-main); }
    .tab-btn.active { background:var(--obsidian); color:#fff; box-shadow:0 3px 10px rgba(15,23,42,.2); }
    .tab-btn.active:hover { background:var(--obsidian-2); color:#fff; }
    .tab-btn.admin-tab { margin-left:auto; color:var(--violet); background:var(--violet-light); }
    .tab-btn.admin-tab.active { background:var(--violet); color:#fff; }
    .subtabs { display:inline-flex; flex-wrap:wrap; gap:4px; background:var(--surface-elev); padding:4px; border-radius:10px; margin-bottom:14px; }
    .subtab-btn { background:transparent; border:none; padding:7px 13px; font-size:12px; font-weight:600; color:var(--text-muted); border-radius:7px; cursor:pointer; }
    .subtab-btn:hover { background:rgba(255,255,255,.5); color:var(--text-main); }
    .subtab-btn.active { background:var(--surface); color:var(--text-main); box-shadow:var(--shadow-sm); }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-md); }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; }
    .panel-soft { background:var(--surface-soft); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px; }
    .panel-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); }
    .panel-title { font-size:14.5px; font-weight:800; }
    .doc-head { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    .doc-title { font-size:1.28rem; font-weight:800; }
    .doc-sub { font-size:13px; color:var(--accent-dark); font-weight:600; margin-top:3px; }
    .banner { padding:9px 14px; border-radius:10px; margin-bottom:14px; font-size:12.5px; font-weight:600; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .banner.ro { background:var(--amber-light); color:var(--amber); border:1px solid #fde68a; }
    .banner.ok { background:var(--accent-light); color:var(--accent-dark); border:1px solid #a7f3d0; }

    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .builder-grid { display:grid; grid-template-columns:1.05fr .95fr; gap:18px; align-items:start; }
    .kpi { background:var(--surface-soft); border:1px solid var(--border); border-radius:12px; padding:14px 16px; border-top:3px solid var(--accent); }
    .kpi.blue { border-top-color:var(--blue); } .kpi.amber { border-top-color:var(--amber); } .kpi.rose { border-top-color:var(--rose); } .kpi.violet { border-top-color:var(--violet); }
    .kpi-lbl { font-size:11px; font-weight:700; color:var(--text-subtle); text-transform:uppercase; }
    .kpi-val { font-size:1.5rem; font-weight:800; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
    .kpi-sub { font-size:11.5px; color:var(--text-muted); }

    .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-md); }
    table.micro { width:100%; border-collapse:collapse; table-layout:fixed; min-width:1240px; background:var(--surface); }
    .micro th,.micro td { border:1px solid var(--border); vertical-align:top; word-wrap:break-word; }
    .micro th { background:var(--surface-soft); padding:9px 7px; text-align:center; }
    .data-table { width:100%; border-collapse:collapse; font-size:12px; }
    .data-table th { background:var(--surface-soft); padding:9px 10px; text-align:left; font-size:11px; color:var(--text-subtle); border-bottom:2px solid var(--border); }
    .data-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
    .data-table tr.row-risk { background:rgba(225,29,72,.05); }
    .row-hdr { width:215px; background:var(--surface-soft); padding:9px 12px; text-align:left; vertical-align:middle !important; font-size:12px; font-weight:600; }
    .md-pill { display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:99px; background:var(--obsidian); color:#34d399; margin-bottom:4px; }
    .md-pill.match { background:var(--rose); color:#fff; }
    .chip-conspect { display:inline-flex; align-items:center; padding:2px 7px; border-radius:99px; font-size:10.5px; font-weight:700; cursor:pointer; background:var(--accent-light); color:var(--accent-dark); border:1px solid #a7f3d0; }
    .chip-conspect:hover { background:var(--accent); color:#fff; }
    .cell-input { width:100%; min-height:36px; padding:7px 9px; font-size:12px; color:var(--text-main); background:transparent; border:none; outline:none; resize:vertical; font-family:inherit; line-height:1.4; }
    .cell-input:focus { background:var(--accent-light); }
    .day-sel { width:100%; padding:6px 7px; border:1px solid var(--border); border-radius:7px; font-size:11.5px; font-weight:700; background:var(--surface); color:var(--text-main); }
    .day-sel[data-v="Восстановительный"] { background:#e0f2fe; color:#0369a1; } .day-sel[data-v="Компенсаторный"] { background:#ede9fe; color:#5b21b6; }
    .day-sel[data-v="Развивающий"] { background:#dcfce7; color:#15803d; } .day-sel[data-v="Пиковый"] { background:#ffe4e6; color:#be123c; }
    .day-sel[data-v="Скоростной"] { background:#ffedd5; color:#c2410c; } .day-sel[data-v="Предматчевый"] { background:#fef3c7; color:#92400e; }
    .day-sel[data-v="Игровой"] { background:#0f172a; color:#34d399; } .day-sel[data-v="Отдых"] { background:#f1f5f9; color:#475569; }
    .stepper { display:flex; align-items:center; gap:4px; padding:3px; background:var(--surface-soft); border:1px solid var(--border); border-radius:7px; }
    .step-btn { width:24px; height:24px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-main); border-radius:5px; font-weight:700; cursor:pointer; }
    .step-val-inp { width:56px; border:none; background:transparent; text-align:center; font-size:12px; font-weight:700; color:var(--text-main); outline:none; }
    .task-list { display:flex; flex-direction:column; gap:4px; padding:4px; }
    .task-row { display:flex; align-items:center; gap:5px; background:var(--surface-soft); border:1px solid var(--border); border-radius:6px; padding:4px 6px; font-size:11.5px; }
    .task-inp { flex:1; border:none; background:transparent; color:var(--text-main); font-size:11.5px; outline:none; min-width:0; }

    .sec-box { border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--surface); }
    .sec-box.drag-over { border-top:3px solid var(--accent); background:var(--accent-light); }
    .sec-head { background:var(--surface-soft); padding:8px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--border); cursor:grab; font-size:12.5px; font-weight:700; }
    .sec-body { padding:9px; display:flex; flex-direction:column; gap:7px; min-height:40px; }
    .add-block-bar { display:flex; flex-wrap:wrap; gap:6px; padding:9px 12px; background:var(--surface-soft); border:1px dashed var(--border-strong); border-radius:10px; margin-top:8px; align-items:center; }
    .drill-item { border:1px solid var(--border); border-radius:9px; padding:8px 10px; background:var(--surface); display:flex; gap:10px; align-items:flex-start; }
    .drill-thumb { border-radius:6px; border:1px solid #047857; flex-shrink:0; background:#059669; }
    .pitch-wrap { background:#064e3b; border-radius:13px; padding:11px; border:2px solid #047857; }
    .pitch-tools { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:7px; }
    .ptool { padding:4px 8px; font-size:11px; font-weight:600; border-radius:6px; background:rgba(15,23,42,.55); color:#f8fafc; border:1px solid rgba(255,255,255,.2); cursor:pointer; }
    .ptool.active { background:#10b981; color:#06281e; border-color:#34d399; font-weight:700; }
    #pitch-canvas { width:100%; aspect-ratio:105/68; height:auto; display:block; border-radius:7px; cursor:crosshair; background:#059669; touch-action:none; }

    .inp,.sel,.ta { width:100%; padding:8px 11px; border:1px solid var(--border-strong); border-radius:8px; font-size:12.5px; background:var(--surface); color:var(--text-main); outline:none; }
    .inp:focus,.sel:focus,.ta:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(16,185,129,.18); }
    .lbl { font-size:11px; font-weight:700; color:var(--text-subtle); display:block; margin-bottom:4px; text-transform:uppercase; }
    .tag { display:inline-block; padding:2px 7px; border-radius:6px; font-size:10.5px; font-weight:700; background:var(--surface-elev); color:var(--text-muted); }
    .pill-ok { background:var(--accent-light); color:var(--accent-dark); } .pill-warn { background:var(--amber-light); color:var(--amber); } .pill-bad { background:var(--rose-light); color:var(--rose); }

    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .cal-cell { min-height:84px; border:1px solid var(--border); border-radius:9px; padding:6px; background:var(--surface-soft); font-size:11.5px; }
    .modal-bg { position:fixed; inset:0; background:rgba(11,17,32,.66); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:999; padding:14px; }
    .modal-bg.open { display:flex; }
    #ui-dialog { z-index:1050; }
    .modal-box { background:var(--surface); color:var(--text-main); border-radius:16px; max-width:740px; width:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--border); }
    .dialog-box { max-width:460px; }
    .modal-hdr { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .modal-bdy { padding:18px 20px; overflow-y:auto; }
    .toast-box { position:fixed; bottom:20px; right:20px; z-index:1100; display:flex; flex-direction:column; gap:8px; max-width:360px; }
    .toast-item { background:var(--obsidian); color:#fff; padding:11px 16px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); border:1px solid #334155; display:flex; align-items:center; gap:10px; }

    @media (max-width:1100px) { .grid-4,.builder-grid,.grid-2 { grid-template-columns:1fr; } }
    @media print { body{background:#fff;color:#0f172a;padding:0;} .no-print{display:none!important;} .card{border:none;box-shadow:none;padding:0;} .table-wrap{overflow:visible;} }
  </style>
</head>
<body>
<div class="container" id="app-root">
  <header class="top-bar no-print">
    <div class="brand-block">
      <div class="brand-logo" aria-hidden="true">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="2" y="4" width="20" height="16" rx="2" stroke-width="2.2"/><line x1="12" y1="4" x2="12" y2="20" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
      </div>
      <div>
        <div class="brand-title"><span id="ui-brand-name">ProPlan</span> <span class="brand-badge" id="ui-brand-badge">GoProduction</span></div>
        <div class="brand-sub" aria-live="polite">
          <span class="sync-dot" id="ui-sync-dot"></span>
          <span id="ui-sync-text">Сохранено</span>
          <span id="ui-mode-label"></span>
          <span id="ui-presence-label"></span>
        </div>
      </div>
    </div>

    <div class="top-actions">
      <button type="button" class="btn btn-ghost-dark" data-act="toggle-lang" id="btn-lang" aria-label="Сменить язык">RU</button>
      <button type="button" class="btn btn-ghost-dark" data-act="toggle-theme" id="btn-theme" aria-label="Сменить тему">Тема</button>
      <button type="button" class="btn btn-ghost-dark" data-act="open-help" title="Горячие клавиши (?)" aria-label="Справка">?</button>
      <button type="button" class="user-pill" data-act="open-auth" aria-label="Профиль">
        <span class="user-av" id="ui-user-av">Т</span>
        <span style="text-align:left;line-height:1.15;">
          <span style="display:block;font-size:12px;font-weight:700;" id="ui-user-name">Профиль</span>
          <span style="display:block;font-size:10px;color:#34d399;" id="ui-user-role">Войти</span>
        </span>
      </button>
      <button type="button" class="btn btn-accent" data-act="open-cycles">Мои циклы (<span id="ui-cycles-cnt">0</span>)</button>
      <button type="button" class="btn btn-ghost-dark" data-act="export-png" aria-label="Сохранить фото PNG">PNG</button>
      <button type="button" class="btn btn-pdf" data-act="export-pdf" aria-label="Сохранить файл PDF">PDF</button>
    </div>
  </header>

  <div id="ui-announce" class="announce-bar hidden" role="status" aria-live="polite"></div>
  <nav class="tabs-bar no-print" id="ui-tabs" role="tablist" aria-label="Разделы"></nav>
  <div id="ui-banner" class="banner ok hidden" role="status"></div>
  <main class="card" id="ui-main"></main>
</div>

<div class="modal-bg" id="ui-modal" role="dialog" aria-modal="true" aria-labelledby="ui-modal-title">
  <div class="modal-box">
    <div class="modal-hdr">
      <h2 class="modal-title" id="ui-modal-title"></h2>
      <button type="button" class="btn" data-act="close-modal" aria-label="Закрыть">✕</button>
    </div>
    <div class="modal-bdy" id="ui-modal-body"></div>
  </div>
</div>

<div class="modal-bg" id="ui-dialog" role="alertdialog" aria-modal="true" aria-labelledby="ui-dialog-title">
  <div class="modal-box dialog-box">
    <div class="modal-hdr">
      <h2 class="modal-title" id="ui-dialog-title"></h2>
      <button type="button" class="btn" id="ui-dialog-close" aria-label="Закрыть диалог">✕</button>
    </div>
    <div class="modal-bdy" id="ui-dialog-body"></div>
  </div>
</div>

<input type="file" id="gps-csv-input" accept=".csv,.txt" class="hidden" />
<div class="toast-box no-print" id="ui-toasts" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  'use strict';

  /* =========================================================

    return String(raw || '').replace(/^КОД\s*:\s*/i,'').trim().toUpperCase().replace(/[АВЕКМНОРСТУХ]/g, c => map[c]||c).replace(/\s+/g,'');

  function parseCsvRows(text) {
    const lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim().length > 0);
    if (!lines.length) return [];
    const header = lines[0];
    const delim = (header.split(';').length > header.split(',').length) ? ';' : ',';
    return lines.map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === delim && !inQ) {
          cols.push(cur.trim()); cur = '';
        } else cur += ch;
      }
      cols.push(cur.trim());
      return cols;
    });
  }

  function calcLoadMetrics(dailyLoads) {
    const week = dailyLoads.slice(-7);
    const acute = week.reduce((a, b) => a + b, 0) / Math.max(1, week.length);
    const chronic = dailyLoads.reduce((a, b) => a + b, 0) / Math.max(1, dailyLoads.length);
    const acwrRolling = chronic > 0 ? +(acute / chronic).toFixed(2) : 0;
    let ewmaA = dailyLoads[0] || 0, ewmaC = dailyLoads[0] || 0;
    dailyLoads.forEach((v) => { ewmaA = v * 0.25 + ewmaA * 0.75; ewmaC = v * 0.069 + ewmaC * 0.931; });
    const acwrEwma = ewmaC > 0 ? +(ewmaA / ewmaC).toFixed(2) : 0;
    const weekSum = week.reduce((a, b) => a + b, 0), mean = weekSum / 7;
    const sd = Math.sqrt(week.reduce((a, v) => a + (v - mean) ** 2, 0) / 7);
    const monotony = sd > 0 ? +(mean / sd).toFixed(2) : 0;
    return { weekSum: Math.round(weekSum), acwrRolling, acwrEwma, monotony, strain: Math.round(weekSum * monotony) };
  }

    const out = {};

      const cur = new Date(start.getTime() + idx * 86400000).getTime();
      if (matchDates.includes(cur)) { out[d] = { label:'MD', isMatch:true }; return; }
      let best = null;
      matchDates.forEach(mt => {
        const diffDays = Math.round((cur - mt) / 86400000);
        if (Math.abs(diffDays) <= 5 && (best === null || Math.abs(diffDays) < Math.abs(best))) best = diffDays;
      });
      if (best !== null) out[d] = { label: best > 0 ? `MD+${best}` : `MD${best}`, isMatch:false };
    });
    return out;
  }

        <button type="button" class="btn" id="dlg-cancel">Отмена</button>
        <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="dlg-ok">Подтвердить</button>
      </div>
    `, (finish) => {
      document.getElementById('dlg-cancel').onclick = () => finish(false);
      document.getElementById('dlg-ok').onclick = () => finish(true);
    });
  }

  function uiPrompt(message, defaultVal = '', title = 'Ввод данных', inputType = 'text') {
    return openDialog(title, `
      <label class="lbl" for="dlg-input">${esc(message)}</label>
      <input id="dlg-input" type="${esc(inputType)}" class="inp" value="${esc(defaultVal)}" style="margin-bottom:14px;" />
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" class="btn" id="dlg-cancel">Отмена</button>
        <button type="button" class="btn btn-primary" id="dlg-ok">Сохранить</button>
      </div>
    `, (finish) => {
      const inp = document.getElementById('dlg-input');
      document.getElementById('dlg-cancel').onclick = () => finish(null);
      document.getElementById('dlg-ok').onclick = () => finish(inp.value);
      inp.onkeydown = (e) => { if (e.key === 'Enter') finish(inp.value); };
    });
  }

  function openConflictModal(q, remoteCell) {
    const mine = Array.isArray(q.value) ? q.value.join(', ') : String(q.value ?? '');
    const theirs = Array.isArray(remoteCell?.value) ? remoteCell.value.join(', ') : String(remoteCell?.value ?? '');
    return openDialog('Конфликт редактирования ячейки', `
      <p style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">Другой тренер уже обновил ячейку <b>${esc(DAY_LBL[q.day] || q.day)} / ${esc(q.row)}</b>:</p>
      <div class="panel-soft" style="margin-bottom:8px;"><div class="lbl">Ваша версия</div><div style="font-size:12.5px;">${esc(mine || '— пусто —')}</div></div>
      <div class="panel-soft" style="margin-bottom:14px;"><div class="lbl">Версия на сервере</div><div style="font-size:12.5px;">${esc(theirs || '— пусто —')}</div></div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <button type="button" class="btn btn-primary" id="cnf-mine">Перезаписать сервер моей версией</button>
        <button type="button" class="btn btn-accent" id="cnf-merge">Объединить обе версии</button>
        <button type="button" class="btn" id="cnf-theirs">Принять версию с сервера</button>
      </div>
    `, (finish) => {
      document.getElementById('cnf-mine').onclick = () => finish('mine');
      document.getElementById('cnf-merge').onclick = () => finish('merge');
      document.getElementById('cnf-theirs').onclick = () => finish('theirs');
    });
  }

  /* =========================================================
     5. ОБЛАЧНЫЙ СЛОЙ (SUPABASE)
     ========================================================= */
  async function sbCall(promise, errPrefix = 'Ошибка сервера') {
    try {
      const res = await promise;
      if (res && res.error) {
        showToast(`${errPrefix}: ${res.error.message}`);
        return { data: null, error: res.error };
      }
      return res;
    } catch (e) {
      showToast(`${errPrefix}: ${e?.message || 'сеть недоступна'}`);
      return { data: null, error: e };
    }
  }

  async function loadCloudWorkspace() {
    if (!sb || !S.user) return;
    try {
      const { data: cfg } = await sbCall(sb.from('site_settings').select('*').eq('id', 1).maybeSingle(), 'Настройки сайта');
      if (cfg) S.siteSettings = { brandName:cfg.brand_name, brandBadge:cfg.brand_badge, announcement:cfg.announcement, signupDisabled:cfg.signup_disabled, readOnly:cfg.read_only };

      const { data: adm, error: admErr } = await sb.from('app_admins').select('user_id').eq('user_id', S.user.id).maybeSingle();
      S.isSuperAdmin = !admErr && Boolean(adm);
      if (!S.isSuperAdmin && S.tab === 'admin') S.tab = 'head';

      const { data: myMems } = await sbCall(
        sb.from('team_members').select('team_id, role, slot_key, is_team_admin, teams(id, name, category)').eq('user_id', S.user.id).eq('status', 'active'),
        'Загрузка команды'
      );
      const mem = myMems?.[0];
      if (!mem) { S.team = null; S.members = []; renderAll(); return; }

      let inviteCode = '—';
      if (mem.is_team_admin || S.isSuperAdmin) {
        const { data: inv } = await sb.from('team_invites').select('code').eq('team_id', mem.team_id).order('created_at', { ascending:false }).limit(1).maybeSingle();
        if (inv) inviteCode = inv.code;
      }

      const { data: mcs } = await sbCall(
        sb.from('microcycles').select('*').eq('team_id', mem.team_id).eq('is_template', false).order('created_at', { ascending:false }).limit(1),
        'Загрузка микроцикла'
      );
      const mc = mcs?.[0];
      S.team = { id:mem.team_id, name:mem.teams?.name || 'Команда', category:mem.teams?.category || '', inviteCode, isTeamAdmin:mem.is_team_admin, role:mem.role, slotKey:mem.slot_key, microcycleId:mc?.id || null };

      if (mc) {
        S.weekStart = mc.week_start || S.weekStart;
        S.cycleType = mc.cycle_type || S.cycleType;
        S.approvalStatus = mc.approval_status || 'draft';
        const { data: cells } = await sbCall(sb.from('plan_cells').select('*').eq('microcycle_id', mc.id), 'Ячейки плана');
        S.cells = {}; S.serverVer = {};
        (cells || []).forEach(c => { const k = `${c.role_key}:${c.slot_key}:${c.day}:${c.row_key}`; S.cells[k] = { value:c.value, version:c.version }; S.serverVer[k] = c.version; });
      }

      const [{ data: memRows }, { data: plRows }, { data: exRows }, { data: mtRows }, { data: cmRows }] = await Promise.all([
        sb.from('team_members').select('user_id, role, slot_key, title, is_team_admin').eq('team_id', mem.team_id).eq('status', 'active'),
        sb.from('players').select('*').eq('team_id', mem.team_id),
        sb.from('exercises').select('*').or(`visibility.eq.public,team_id.eq.${mem.team_id},owner_id.eq.${S.user.id}`),
        sb.from('matches').select('*').eq('team_id', mem.team_id).order('date'),
        sb.from('comments').select('*').eq('team_id', mem.team_id).order('created_at', { ascending:false })
      ]);
      const ids = [...new Set([...(memRows || []).map(m => m.user_id), ...(cmRows || []).map(c => c.author_id)])];
      const { data: profRows } = ids.length ? await sb.from('profiles').select('id, full_name').in('id', ids) : { data: [] };
      const nameOf = Object.fromEntries((profRows || []).map(p => [p.id, p.full_name]));

      S.members = (memRows || []).map(m => ({ userId:m.user_id, fullName:nameOf[m.user_id] || 'Тренер', role:m.role, slotKey:m.slot_key, title:m.title, isTeamAdmin:m.is_team_admin }));
      if (plRows?.length) S.players = plRows.map(p => ({ id:p.id, number:p.number, fullName:p.full_name, position:p.position, status:p.status }));
      if (exRows?.length) S.exercises = exRows.map(e => ({ id:e.id, title:e.title, cat:e.category, dur:e.duration, space:e.space, desc:e.description, visibility:e.visibility, video:e.video_url||'', pitchMode:e.pitch_mode, pitch:e.pitch_objects }));
      if (mtRows) S.matches = mtRows.map(m => ({ id:m.id, date:m.date, kickoff:m.kickoff||'', opponent:m.opponent, homeAway:m.home_away, competition:m.competition }));
      if (cmRows) S.comments = cmRows.map(c => ({ id:c.id, day:c.entity_id, author:nameOf[c.author_id]||'Тренер', body:c.body, resolved:c.resolved, ts:c.created_at }));

      if (S.isSuperAdmin) {
        const { data: logs } = await sb.from('audit_log').select('*').order('ts', { ascending:false }).limit(50);
        if (logs) S.auditLog = logs.map(l => ({ actor: l.actor_id || 'Система', action:l.action, details:`${l.entity} ${JSON.stringify(l.details)}`, ts:l.ts }));
      }

      subscribeRealtime(mem.team_id, mc?.id);
      renderAll();
    } catch {
      showToast('Не удалось загрузить данные команды');
    }
  }

  function subscribeRealtime(teamId, microcycleId) {
    if (!sb) return;
    if (rtChannel) sb.removeChannel(rtChannel);
    rtChannel = sb.channel(`team-${teamId}`, { config: { presence: { key: S.user?.id || 'anon' } } });
    if (microcycleId) {
      rtChannel.on('postgres_changes', { event:'*', schema:'public', table:'plan_cells', filter:`microcycle_id=eq.${microcycleId}` }, (p) => {
        if (p.new) {
          const c = p.new, k = `${c.role_key}:${c.slot_key}:${c.day}:${c.row_key}`;
          if (pendingSaves.has(k)) return;
          S.cells[k] = { value:c.value, version:c.version }; S.serverVer[k] = c.version;
          if (['head','assistant','gk','fitness'].includes(S.tab) && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) renderMicrocycle();
        }
      });
    }
    rtChannel.on('presence', { event:'sync' }, () => {
      const state = rtChannel.presenceState();
      S.onlineNames = Object.values(state).flat().map(x => x.name).filter(Boolean);
      const el = document.getElementById('ui-presence-label');
      if (el) el.textContent = S.onlineNames.length > 1 ? `• В сети: ${S.onlineNames.length}` : '';
    });
    rtChannel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await rtChannel.track({ name: S.user?.fullName || 'Тренер', tab: S.tab });
    });
  }

  function canEditRole(role, slotKey = 'default') {
    if (S.isSuperAdmin) return true;
    if (S.siteSettings.readOnly) return false;
    if (S.mode === 'local') return true;
    if (!S.team) return false;
    if (S.team.isTeamAdmin) return true;
    if (S.team.role !== role) return false;
    return role !== 'assistant' || S.team.slotKey === slotKey;
  }

  function getCell(role, slot, day, row) { return S.cells[`${role}:${slot}:${day}:${row}`]?.value ?? ''; }

  const pendingSaves = new Map();
  S.serverVer = S.serverVer || {};

  async function pushCell(q) {
    const prevVer = S.serverVer[q.key] || 0;
    let res;
    if (prevVer === 0) {
      res = await sb.from('plan_cells').insert({ microcycle_id:q.mcId, role_key:q.role, slot_key:q.slot, day:q.day, row_key:q.row, value:q.value, version:1 }).select('version');
    } else {
      res = await sb.from('plan_cells').update({ value:q.value, version:prevVer + 1 })
        .eq('microcycle_id', q.mcId).eq('role_key', q.role).eq('slot_key', q.slot).eq('day', q.day).eq('row_key', q.row).eq('version', prevVer).select('version');
    }
    if (!res.error && res.data?.length) {
      S.serverVer[q.key] = res.data[0].version;
      S.cells[q.key] = { value:q.value, version:res.data[0].version };
      return { ok: true };
    }
    const { data: remote } = await sb.from('plan_cells').select('value, version')
      .eq('microcycle_id', q.mcId).eq('role_key', q.role).eq('slot_key', q.slot).eq('day', q.day).eq('row_key', q.row).maybeSingle();
    return { ok: false, remote };
  }

  async function handleConflict(q, remote) {
    setSyncState('conflict');
    const choice = await openConflictModal(q, remote);
    if (!choice || choice === 'theirs') {
      if (remote) {
        S.cells[q.key] = { value: remote.value, version: remote.version };
        S.serverVer[q.key] = remote.version;
      }
      renderMicrocycle();
      setSyncState('saved');
      return;
    }
    let finalVal = q.value;
    if (choice === 'merge' && remote) {
      if (Array.isArray(q.value) || Array.isArray(remote.value)) {
        const a = Array.isArray(remote.value) ? remote.value : [remote.value];
        const b = Array.isArray(q.value) ? q.value : [q.value];
        finalVal = [...new Set([...a, ...b].filter(Boolean))];
      } else {
        finalVal = `${remote.value}\n---\n${q.value}`;
      }
    }
    S.serverVer[q.key] = remote ? remote.version : 0;
    const retry = await pushCell({ ...q, value: finalVal });
    if (retry.ok) {
      recordAudit('conflict_resolved', `${q.day}.${q.row}`, remote?.value, finalVal);
      renderMicrocycle();
      setSyncState('saved');
      showToast('Конфликт устранён');
    } else {
      await loadCloudWorkspace();
    }
  }

  function setCell(role, slot, day, row, value, skipUndo = false) {
    if (!canEditRole(role, slot)) return;
    const key = `${role}:${slot}:${day}:${row}`;
    const prevVal = S.cells[key]?.value;
    if (!skipUndo && JSON.stringify(prevVal) !== JSON.stringify(value)) {
      planUndo.push(JSON.parse(JSON.stringify(S.cells)));
      if (planUndo.length > 30) planUndo.shift();
    }
    S.cells[key] = { value, version: S.serverVer[key] || 0 };
    setSyncState(navigator.onLine ? 'saving' : 'offline');
    saveLocal();

    clearTimeout(pendingSaves.get(key));
    pendingSaves.set(key, setTimeout(async () => {
      pendingSaves.delete(key);
      recordAudit('cell_edit', `${role}:${day}:${row}`, prevVal ?? '', value);
      if (!(S.mode === 'cloud' && sb && S.team?.microcycleId)) return setSyncState('saved');
      const q = { key, role, slot, day, row, value, mcId:S.team.microcycleId };
      if (!navigator.onLine) {
        offlineQueue = offlineQueue.filter(x => x.key !== key);
        offlineQueue.push(q);
        saveOfflineQueue();
        return setSyncState('offline');
      }
      const res = await pushCell(q);
      if (res.ok) setSyncState('saved');
      else await handleConflict(q, res.remote);
    }, 550));
  }

  async function flushOfflineQueue() {
    if (!(S.mode === 'cloud' && sb) || !offlineQueue.length) return setSyncState('saved');
    const queue = [...offlineQueue];
    offlineQueue = [];
    saveOfflineQueue();
    for (const q of queue) {
      const res = await pushCell(q);
      if (!res.ok) await handleConflict(q, res.remote);
    }
    setSyncState('saved');
  }

  /* =========================================================
     6. ТЕМА, ОБОЛОЧКА И ЕДИНАЯ ТАБЛИЦА МИКРОЦИКЛА
     ========================================================= */
  function applyTheme() {
    const resolved = S.theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;
    document.documentElement.setAttribute('data-theme', resolved);
    document.getElementById('btn-theme').textContent = S.theme === 'dark' ? '🌙' : S.theme === 'light' ? '☀️' : '🖥️';
  }

  function renderShell() {
    document.getElementById('ui-brand-name').textContent = S.siteSettings.brandName;
    document.getElementById('ui-brand-badge').textContent = S.siteSettings.brandBadge;
    document.getElementById('btn-lang').textContent = S.lang.toUpperCase();
    document.getElementById('ui-cycles-cnt').textContent = S.savedCycles.length;
    document.getElementById('ui-mode-label').textContent = S.team?.name ? `• ${S.team.name}` : '';

    const av = document.getElementById('ui-user-av'), un = document.getElementById('ui-user-name'), ur = document.getElementById('ui-user-role');
    if (S.user) {
      av.textContent = (S.user.fullName || S.user.email || 'Т').slice(0,2).toUpperCase();
      un.textContent = S.user.fullName || S.user.email;
      ur.textContent = `${t(S.team?.role || 'head')}${S.isSuperAdmin ? ' • Админ' : ''}`;
    } else {
      av.textContent = 'Т'; un.textContent = 'Гость'; ur.textContent = 'Войти';
    }

    if (S.siteSettings.announcement) { DOM.announce.classList.remove('hidden'); DOM.announce.textContent = '📢 ' + S.siteSettings.announcement; }
    else DOM.announce.classList.add('hidden');

    if (S.siteSettings.readOnly && !S.isSuperAdmin) {
      DOM.banner.className = 'banner ro';
      DOM.banner.textContent = '⚠️ Платформа переведена администратором в режим только чтения.';
      DOM.banner.classList.remove('hidden');
    } else {
      DOM.banner.classList.add('hidden');
    }

    const tabs = ['head','assistant','gk','fitness','builder','calendar','team'];
    if (S.isSuperAdmin) tabs.push('admin');
    DOM.tabs.innerHTML = tabs.map(id => {
      const locked = ['head','assistant','gk','fitness'].includes(id) && !canEditRole(id, id === 'assistant' ? S.activeSlot : 'default');
      return `<button type="button" role="tab" aria-selected="${S.tab===id}" class="tab-btn ${S.tab===id?'active':''} ${id==='admin'?'admin-tab':''}" data-act="tab" data-id="${id}">${esc(t(id))}${locked?' 🔒':''}</button>`;
    }).join('');
  }

  function renderMicrocycle() {
    const role = S.tab, slot = role==='assistant' ? S.activeSlot : 'default', editable = canEditRole(role, slot);
    const mdMap = computeMdLabels(S.weekStart, S.matches), startDt = new Date(S.weekStart + 'T00:00:00');

    let html = '';
    if (role === 'assistant') {
      const slots = S.members.filter(m => m.role === 'assistant');
      if (slots.length > 0) html += `<div class="subtabs">${slots.map(m => `<button type="button" class="subtab-btn ${S.activeSlot===m.slotKey?'active':''}" data-act="slot" data-id="${esc(m.slotKey)}">${esc(m.fullName)} (${esc(m.title||'Ассистент')})</button>`).join('')}</div>`;
    }
    if (role === 'fitness') {
      html += `<div class="subtabs"><button type="button" class="subtab-btn ${S.fitnessSub==='plan'?'active':''}" data-act="fit-sub" data-id="plan">${esc(t('weekPlan'))}</button><button type="button" class="subtab-btn ${S.fitnessSub==='monitoring'?'active':''}" data-act="fit-sub" data-id="monitoring">${esc(t('monitoring'))}</button></div>`;
      if (S.fitnessSub === 'monitoring') return renderMonitoring();
    }

    html += `<div id="export-area">
      <div class="doc-head">
        <div><h1 class="doc-title">${esc(t(role))} — Недельный микроцикл</h1><p class="doc-sub">${esc(S.team?.name || '')}</p></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;" class="no-print">
          <span class="tag ${S.approvalStatus==='approved'?'pill-ok':S.approvalStatus==='review'?'pill-warn':''}">${esc(t(S.approvalStatus))}</span>
          <select class="sel" style="width:auto;" aria-label="Статус согласования" data-act="set-approval" ${S.team?.isTeamAdmin||S.mode==='local'?'':'disabled'}><option value="draft" ${S.approvalStatus==='draft'?'selected':''}>Черновик</option><option value="review" ${S.approvalStatus==='review'?'selected':''}>На согласовании</option><option value="approved" ${S.approvalStatus==='approved'?'selected':''}>Утверждено</option></select>
          <button type="button" class="btn" data-act="save-version">Версии (${S.versions.length})</button>
          <button type="button" class="btn btn-accent" data-act="save-cycle">Сохранить цикл</button>
          <button type="button" class="btn btn-danger" data-act="clear-tab" ${editable?'':'disabled'}>Очистить</button>
        </div>
      </div>
      <div class="grid-2" style="margin-bottom:14px;">
        <div class="panel-soft"><label class="lbl">Неделя (Пн) и команда</label><div style="display:flex;gap:8px;"><input type="date" class="inp" aria-label="Неделя" value="${esc(S.weekStart)}" data-act="set-week-start" style="width:155px;" ${editable?'':'disabled'} /><input type="text" class="inp" aria-label="Команда" value="${esc(S.team?.name||'')}" data-act="set-team-name" ${editable?'':'disabled'} /></div></div>
        <div class="panel-soft"><label class="lbl">Тип микроцикла</label><input type="text" class="inp" aria-label="Тип микроцикла" value="${esc(S.cycleType)}" data-act="set-cycle-type" ${editable?'':'disabled'} /></div>
      </div>
      <div class="table-wrap"><table class="micro"><thead><tr>
        <th class="row-hdr">Параметры</th>
        ${DAYS.map((d,i)=>{ const dt=new Date(startDt.getTime()+i*86400000), dd=`${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}`, md=mdMap[d], linked=S.linkedSessions?.[`${role}:${slot}:${d}`];
          return `<th>${md?`<span class="md-pill ${md.isMatch?'match':''}">${esc(md.label)}</span>`:''}<div style="font-size:12.5px;font-weight:700;">${DAY_LBL[d]}</div><div style="font-size:11px;color:var(--text-subtle);margin:2px 0;">${dd}</div><div style="display:flex;justify-content:center;gap:4px;margin-top:3px;" class="no-print"><button type="button" class="btn" style="padding:2px 7px;font-size:10.5px;" data-act="open-day-comments" data-id="${d}">💬 ${S.comments.filter(c=>c.day===d&&!c.resolved).length}</button>${linked?`<button type="button" class="chip-conspect" data-act="open-linked" data-key="${role}:${slot}:${d}">Конспект</button>`:''}</div></th>`;
        }).join('')}
      </tr></thead><tbody>
        ${ROLE_ROWS[role].map((r,idx)=>`<tr><td class="row-hdr"><span style="color:var(--text-subtle);margin-right:5px;">${String(idx+1).padStart(2,'0')}</span>${esc(r.title)}</td>${DAYS.map(d=>{
          const val = getCell(role, slot, d, r.id);
          if (r.type==='dayType') return `<td style="padding:5px;"><select class="day-sel" data-v="${esc(val)}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" ${editable?'':'disabled'}>${DAY_TYPES.map(dt=>`<option value="${esc(dt)}" ${val===dt?'selected':''}>${esc(dt||'— Тип —')}</option>`).join('')}</select></td>`;
          if (r.type==='playersCount'||r.type==='duration'||r.type==='startTime') {
            const cur = val || (r.type==='playersCount'?'0':r.type==='duration'?'90 мин':'10:00');
            return `<td style="padding:5px;"><div class="stepper"><button type="button" class="step-btn" aria-label="Уменьшить" data-act="step" data-dir="-1" data-type="${r.type}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" ${editable?'':'disabled'}>−</button>${r.type==='duration'&&editable?`<input type="text" class="step-val-inp tabular" aria-label="Длительность" value="${esc(cur)}" data-act="edit-dur" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" />`:`<span class="tabular" style="flex:1;text-align:center;font-size:12px;font-weight:700;">${esc(cur)}</span>`}<button type="button" class="step-btn" aria-label="Увеличить" data-act="step" data-dir="1" data-type="${r.type}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" ${editable?'':'disabled'}>+</button></div></td>`;
          }

            return `<td><div class="task-list">${arr.map((task,ti)=>`<div class="task-row"><span style="color:var(--accent);font-weight:800;">•</span><input type="text" class="task-inp" aria-label="Задача" value="${esc(task)}" data-task-idx="${ti}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" ${editable?'':'disabled'} /><button type="button" class="btn no-print" style="padding:1px 5px;font-size:10px;" data-act="inspect-task" data-text="${esc(task)}" data-key="${role}:${slot}:${d}">Поле</button>${editable?`<button type="button" class="btn btn-danger no-print" aria-label="Удалить задачу" style="padding:1px 5px;font-size:10px;" data-act="del-task" data-task-idx="${ti}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}">×</button>`:''}</div>`).join('')}${editable?`<button type="button" class="btn no-print" style="font-size:11px;padding:4px;" data-act="add-task" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}">+ задача</button>`:''}</div></td>`;
          }
          return `<td><textarea rows="2" class="cell-input" aria-label="${esc(r.title)}" data-cell-role="${role}" data-cell-slot="${slot}" data-cell-day="${d}" data-cell-row="${r.id}" ${editable?'':'disabled'}>${esc(val)}</textarea></td>`;
        }).join('')}</tr>`).join('')}

    </div>`;
    DOM.main.innerHTML = html;
  }

  /* =========================================================
     7. МОНИТОРИНГ И НАГРУЗКА
     ========================================================= */
  function getDayPlanMetrics(day) {
    const dt = getCell('fitness','default',day,'dayType') || '';
    const dur = dt === 'Отдых' ? 0 : (parseInt(String(getCell('fitness','default',day,'duration')||'90').replace(/\D/g,''),10) || 90);
    return { dayType: dt || '—', duration: dur, plannedLoad: Math.round(dur * (DAY_INTENSITY[dt] ?? 0.7) * 10) };
  }

  function computePlayerMonitoringRow(p, day, plan) {
    const l = S.playerLogs[day]?.[p.id] || { rpe:0, sleep:4, fatigue:4, soreness:4, stress:4, distance:0, hsr:0 };
    const srpe = Math.round((Number(l.rpe)||0) * plan.duration);
    const ready = Math.round(((l.sleep + l.fatigue + l.soreness + l.stress)/20)*100);
    const weekVals = DAYS.map(d => (S.playerLogs[d]?.[p.id]?.rpe || 0) * getDayPlanMetrics(d).duration);
    const baseline = Array(21).fill(Math.max(250, Math.round((plan.plannedLoad || 450) * 0.75)));
    const m = calcLoadMetrics([...baseline, ...weekVals]);
    const warnings = [];
    if (ready < 60) warnings.push('Wellness < 60%');
    if (m.acwrEwma > 1.5) warnings.push(`ACWR ${m.acwrEwma}`);
    if (m.monotony > 2.0) warnings.push(`Монот. ${m.monotony}`);
    if (plan.plannedLoad > 0 && srpe > plan.plannedLoad * 1.35) warnings.push('Пик sRPE');
    return { l, srpe, ready, m, warnings };
  }

        <td><input type="number" class="inp" aria-label="Стресс" style="width:48px;padding:4px;text-align:center;" min="1" max="5" value="${l.stress}" data-mon-field="stress" data-pid="${p.id}" ${editable?'':'disabled'} /></td>
        <td><input type="number" class="inp" aria-label="Дистанция" style="width:68px;padding:4px;text-align:center;" step="100" value="${l.distance}" data-mon-field="distance" data-pid="${p.id}" ${editable?'':'disabled'} /></td>
        <td><input type="number" class="inp" aria-label="HSR" style="width:62px;padding:4px;text-align:center;" step="20" value="${l.hsr}" data-mon-field="hsr" data-pid="${p.id}" ${editable?'':'disabled'} /></td>

    const pc = Math.max(1, S.players.length);
    const weekLoads = DAYS.map(d => { const pm = getDayPlanMetrics(d); return { d, plan:pm.plannedLoad, fact:Math.round(S.players.reduce((s,p)=>s+((S.playerLogs[d]?.[p.id]?.rpe||0)*pm.duration),0)/pc) }; });
    const maxL = Math.max(800, ...weekLoads.map(x => Math.max(x.plan, x.fact)));
    const barsSvg = `<svg viewBox="0 0 520 170" style="width:100%;height:auto;">${weekLoads.map((x,i)=>{ const x0=30+i*68, hP=(x.plan/maxL)*125, hF=(x.fact/maxL)*125; return `<rect x="${x0}" y="${138-hP}" width="18" height="${hP}" rx="4" fill="#cbd5e1"/><rect x="${x0+20}" y="${138-hF}" width="18" height="${hF}" rx="4" fill="#10b981"/><text x="${x0+19}" y="158" text-anchor="middle" font-size="11" fill="currentColor">${DAY_SHORT[x.d]}</text>`; }).join('')}</svg>`;

    const curWeekPlan = weekLoads.reduce((a,b) => a + b.plan, 0);
    const curWeekFact = weekLoads.reduce((a,b) => a + b.fact, 0);
    const multiWeeks = [...(S.weeklyHistory || []).slice(-7), { label:'Текущая', plan:curWeekPlan, fact:curWeekFact }];
    const maxMw = Math.max(1000, ...multiWeeks.map(w => Math.max(w.plan, w.fact)));
    const trendSvg = `<svg viewBox="0 0 520 170" style="width:100%;height:auto;">${multiWeeks.map((w,i)=>{ const step=Math.floor(460/Math.max(1,multiWeeks.length)), x0=32+i*step, hP=(w.plan/maxMw)*120, hF=(w.fact/maxMw)*120; return `<rect x="${x0}" y="${136-hP}" width="16" height="${hP}" rx="3" fill="#94a3b8"/><rect x="${x0+18}" y="${136-hF}" width="16" height="${hF}" rx="3" fill="#0284c7"/><text x="${x0+17}" y="156" text-anchor="middle" font-size="10.5" fill="currentColor">${esc(w.label)}</text>`; }).join('')}</svg>`;

    DOM.main.innerHTML = `
      <div class="subtabs"><button type="button" class="subtab-btn" data-act="fit-sub" data-id="plan">${esc(t('weekPlan'))}</button><button type="button" class="subtab-btn active" data-act="fit-sub" data-id="monitoring">${esc(t('monitoring'))}</button></div>
      <div id="export-area">
        <div class="doc-head">
          <div><h1 class="doc-title">Мониторинг нагрузки и здоровья</h1><p class="doc-sub">sRPE, ACWR, монотония, Wellness и GPS-метрики</p></div>

          <div class="kpi"><div class="kpi-lbl">Готовность (${DAY_SHORT[day]})</div><div class="kpi-val" id="kpi-ready">${Math.round(readySum/pc)}%</div><div class="kpi-sub">Средний Wellness</div></div>
          <div class="kpi blue"><div class="kpi-lbl">Факт / План дня</div><div class="kpi-val" id="kpi-load">${Math.round(factSum/pc)} / ${plan.plannedLoad}</div><div class="kpi-sub">sRPE (AU) • ${plan.duration} мин</div></div>
          <div class="kpi amber"><div class="kpi-lbl">Недельная сумма</div><div class="kpi-val" id="kpi-week">${curWeekFact}</div><div class="kpi-sub">План: ${curWeekPlan} AU</div></div>
          <div class="kpi rose"><div class="kpi-lbl">Игроки в риске</div><div class="kpi-val" id="kpi-risk">${riskCnt}</div><div class="kpi-sub">ACWR &gt; 1.5 / Wellness &lt; 60%</div></div>
        </div>

          <div class="panel"><div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">Текущая неделя: План (серый) vs Факт (зелёный)</div>${barsSvg}</div>
          <div class="panel"><div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">Динамика за 4–8 недель: План vs Факт (AU)</div>${trendSvg}</div>
        </div>

  function updateMonitoringRowInPlace(pid) {
    const day = S.selectedMonDay, plan = getDayPlanMetrics(day);
    const p = S.players.find(x => x.id === pid);
    if (!p) return;
    const { srpe, ready, m, warnings } = computePlayerMonitoringRow(p, day, plan);
    const srpeEl = document.querySelector(`[data-cell-srpe="${pid}"]`);
    const acwrEl = document.querySelector(`[data-cell-acwr="${pid}"]`);
    const monoEl = document.querySelector(`[data-cell-mono="${pid}"]`);
    const readyEl = document.querySelector(`[data-cell-ready="${pid}"]`);
    const rowEl = document.querySelector(`[data-player-row="${pid}"]`);
    if (srpeEl) srpeEl.innerHTML = `<b>${srpe}</b>`;
    if (acwrEl) acwrEl.innerHTML = `<span class="tag ${m.acwrEwma>1.5?'pill-bad':m.acwrEwma>=0.8?'pill-ok':''}">${m.acwrEwma}</span>`;
    if (monoEl) monoEl.innerHTML = `<span class="tag ${m.monotony>2?'pill-warn':''}">${m.monotony}</span>`;
    if (readyEl) readyEl.innerHTML = `<span class="tag ${ready>=75?'pill-ok':ready>=55?'pill-warn':'pill-bad'}">${ready}%</span>`;
    if (rowEl) rowEl.className = warnings.length ? 'row-risk' : '';

    const pc = Math.max(1, S.players.length);
    let readySum = 0, factSum = 0, riskCnt = 0;
    S.players.forEach(pl => {
      const r = computePlayerMonitoringRow(pl, day, plan);
      readySum += r.ready; factSum += r.srpe;
      if (r.warnings.length) riskCnt++;
    });
    const kpiR = document.getElementById('kpi-ready'), kpiL = document.getElementById('kpi-load'), kpiK = document.getElementById('kpi-risk');
    if (kpiR) kpiR.textContent = `${Math.round(readySum/pc)}%`;
    if (kpiL) kpiL.textContent = `${Math.round(factSum/pc)} / ${plan.plannedLoad}`;
    if (kpiK) kpiK.textContent = `${riskCnt}`;
  }

            </div>`).join('')}</div>
          <div class="add-block-bar no-print"><span class="lbl" style="margin:0 4px 0 0;">+ Блок:</span><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="add-sec" data-id="warmup">Разминка</button><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="add-sec" data-id="prep">Подгот. упр.</button><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="add-sec" data-id="mainGame">Игровое</button><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="add-sec" data-id="cool">Заминка</button></div>

          ${S.savedSessions.length ? `<div style="margin-top:16px;" class="no-print"><div class="lbl" style="margin-bottom:6px;">Сохранённые конспекты (${S.savedSessions.length})</div>${S.savedSessions.map((ss,i)=>`<div class="panel-soft" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:8px 11px;"><div><b style="font-size:12.5px;">${esc(ss.meta?.title||'Занятие')}</b><div style="font-size:11px;color:var(--text-subtle);">${esc(ss.meta?.date||'')} • ${ss.sections.reduce((a,x)=>a+x.drills.length,0)} упр.</div></div><div style="display:flex;gap:5px;"><button type="button" class="btn btn-primary" style="padding:3px 9px;font-size:11px;" data-act="load-session" data-idx="${i}">Открыть</button><button type="button" class="btn btn-danger" aria-label="Удалить конспект" style="padding:3px 7px;font-size:11px;" data-act="del-session" data-idx="${i}">×</button></div></div>`).join('')}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="panel">
            <div class="panel-header">
              <div><div class="panel-title">Тактическая доска</div><div style="font-size:11px;color:var(--text-subtle);" id="pitch-frame-lbl">Кадр ${S.pitch.frameIdx+1}/${S.pitch.frames.length}</div></div>
              <div style="display:flex;gap:5px;flex-wrap:wrap;"><select class="sel" aria-label="Режим поля" style="width:auto;padding:4px 7px;font-size:11px;" data-act="pitch-mode"><option value="full" ${S.pitch.mode==='full'?'selected':''}>Полное поле</option><option value="half" ${S.pitch.mode==='half'?'selected':''}>Половина (гориз.)</option><option value="zones" ${S.pitch.mode==='zones'?'selected':''}>Тактические зоны</option></select><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="pitch-snap">${S.pitch.snapGrid?'Сетка: ВКЛ':'Сетка: ВЫКЛ'}</button><button type="button" class="btn" style="padding:4px 8px;font-size:11px;" data-act="pitch-clear">Очистить</button></div>

            <div class="pitch-wrap" style="margin-bottom:12px;">

            </div>
            <div class="grid-2"><div style="grid-column:1/-1;"><label class="lbl">Название упражнения</label><input id="ex-title" class="inp" placeholder="Рондо 6v3 со сменой зоны" /></div><div><label class="lbl">Категория</label><select id="ex-cat" class="sel"><option>Разминка</option><option>Техника</option><option>Тактика</option><option>Физподготовка</option><option>Вратари</option><option>Игровая</option></select></div><div><label class="lbl">Длит. / Площадка</label><div style="display:flex;gap:5px;"><input id="ex-dur" type="number" class="inp" value="15" style="width:68px;" /><input id="ex-space" class="inp" placeholder="25×20 м" /></div></div><div><label class="lbl">Видимость</label><select id="ex-vis" class="sel"><option value="team">Команда</option><option value="private">Личное</option><option value="public">Публичное</option></select></div><div><label class="lbl">Видео (URL)</label><input id="ex-video" class="inp" placeholder="https://youtube.com/..." /></div><div style="grid-column:1/-1;"><label class="lbl">Описание</label><textarea id="ex-desc" class="ta" rows="2"></textarea></div></div>
            <div style="display:flex;gap:7px;margin-top:8px;"><button type="button" class="btn btn-accent" style="flex:1;" data-act="save-ex" data-add="0">В базу</button><button type="button" class="btn btn-primary" style="flex:1;" data-act="save-ex" data-add="1">В базу и занятие</button></div>

            <div id="ex-lib-list" style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;">${renderExerciseLibraryHtml()}</div>
          </div>
        </div>
      </div>`;

    S.sections.forEach(sec => sec.drills.forEach((dr,di)=>{ const c=document.getElementById(`st-${sec.id}-${di}`); if(c) drawPitchCanvas(c, dr.pitch||[], dr.pitchMode||'full'); }));
    filteredEx.forEach(ex => { const c=document.getElementById(`lib-${ex.id}`); if(c) drawPitchCanvas(c, ex.pitch||[], ex.pitchMode||'full'); });
    bindPitchCanvasEvents();
    bindSectionDragAndDrop();
  }

  function drawPitchCanvas(canvas, customObjs = null, customMode = null) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d'), items = customObjs || S.pitch.frames[S.pitch.frameIdx] || [], mode = customMode || S.pitch.mode || 'full';
    const W = canvas.width, H = canvas.height, isHalf = mode === 'half';
    for (let i=0;i<12;i++) { ctx.fillStyle = i%2===0?'#059669':'#04875e'; ctx.fillRect(Math.round((W/12)*i), 0, Math.round(W/12)+1, H); }
    const mScale = isHalf ? Math.min((W-40)/68,(H-36)/52.5) : Math.min((W-40)/105,(H-26)/68);
    const pW = isHalf?68*mScale:105*mScale, pH = isHalf?52.5*mScale:68*mScale, ox = (W-pW)/2, oy = isHalf?22:(H-pH)/2;
    const mx = (m)=>ox+m*mScale, my = (m)=>oy+m*mScale, arcAng = Math.acos(5.5/9.15);

    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=Math.max(1.2,W/320); ctx.strokeRect(ox,oy,pW,pH);
    if (isHalf) {
      const gW=7.32*mScale, gD=2.44*mScale; ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(mx(34)-gW/2,oy-gD,gW,gD); ctx.strokeRect(mx(34)-gW/2,oy-gD,gW,gD);
      ctx.strokeRect(mx(34-9.16),oy,18.32*mScale,5.5*mScale); ctx.strokeRect(mx(34-20.16),oy,40.32*mScale,16.5*mScale);
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mx(34),my(11),2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx(34),my(11),9.15*mScale,Math.PI/2-arcAng,Math.PI/2+arcAng); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx(34),my(52.5),9.15*mScale,Math.PI,Math.PI*2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(mx(52.5),oy); ctx.lineTo(mx(52.5),oy+pH); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx(52.5),my(34),9.15*mScale,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mx(52.5),my(34),2.5,0,Math.PI*2); ctx.fill();
      ctx.strokeRect(ox,my(34-20.16),16.5*mScale,40.32*mScale); ctx.strokeRect(ox,my(34-9.16),5.5*mScale,18.32*mScale);
      ctx.beginPath(); ctx.arc(mx(11),my(34),2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(mx(11),my(34),9.15*mScale,-arcAng,arcAng); ctx.stroke();
      ctx.strokeRect(mx(105-16.5),my(34-20.16),16.5*mScale,40.32*mScale); ctx.strokeRect(mx(105-5.5),my(34-9.16),5.5*mScale,18.32*mScale);
      ctx.beginPath(); ctx.arc(mx(94),my(34),2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(mx(94),my(34),9.15*mScale,Math.PI-arcAng,Math.PI+arcAng); ctx.stroke();
      const gW=7.32*mScale, gD=2.44*mScale; ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.fillRect(ox-gD,my(34)-gW/2,gD,gW); ctx.strokeRect(ox-gD,my(34)-gW/2,gD,gW);
      ctx.fillRect(ox+pW,my(34)-gW/2,gD,gW); ctx.strokeRect(ox+pW,my(34)-gW/2,gD,gW);
      if (mode==='zones') {
        ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,0.4)';
        [35,70].forEach(x=>{ctx.beginPath();ctx.moveTo(mx(x),oy);ctx.lineTo(mx(x),oy+pH);ctx.stroke();});
        [13.6,24.5,43.5,54.4].forEach(y=>{ctx.beginPath();ctx.moveTo(ox,my(y));ctx.lineTo(ox+pW,my(y));ctx.stroke();});
        ctx.restore();
      }
    }

    const sc = W / 630;
    items.filter(o=>o.type==='zone').forEach(o=>{ ctx.save(); ctx.fillStyle='rgba(250,204,21,0.22)'; ctx.strokeStyle='#fde047'; ctx.setLineDash([5*sc,4*sc]); ctx.fillRect(mx(o.x),my(o.y),o.w*mScale,o.h*mScale); ctx.strokeRect(mx(o.x),my(o.y),o.w*mScale,o.h*mScale); ctx.restore(); });
    items.filter(o=>['arrow','run','dribble'].includes(o.type)).forEach(o=>{
      const x1=mx(o.x1),y1=my(o.y1),x2=mx(o.x2),y2=my(o.y2); ctx.save(); ctx.lineWidth=Math.max(1.2,2.3*sc);
      if(o.type==='arrow'){ctx.strokeStyle='#fde047';ctx.fillStyle='#fde047';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
      else if(o.type==='run'){ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.setLineDash([5*sc,4*sc]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
      else { ctx.strokeStyle='#38bdf8';ctx.fillStyle='#38bdf8';const d=Math.hypot(x2-x1,y2-y1),st=Math.max(4,Math.floor(d/(10*sc))),a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x1,y1);for(let s=1;s<=st;s++){const tp=s/st,bx=x1+(x2-x1)*tp,by=y1+(y2-y1)*tp,amp=(s%2===0?1:-1)*3.5*sc*(s===st?0:1);ctx.lineTo(bx+Math.cos(a+Math.PI/2)*amp,by+Math.sin(a+Math.PI/2)*amp);}ctx.stroke(); }
      const ang=Math.atan2(y2-y1,x2-x1),hs=Math.max(5,9*sc); ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(ang-0.45),y2-hs*Math.sin(ang-0.45));ctx.lineTo(x2-hs*Math.cos(ang+0.45),y2-hs*Math.sin(ang+0.45));ctx.closePath();ctx.fill();ctx.restore();
    });
    items.forEach((o,idx)=>{
      const x=mx(o.x),y=my(o.y);
      if(['att','def','gk','neu'].includes(o.type)){ const col={att:'#0ea5e9',def:'#e11d48',gk:'#f59e0b',neu:'#8b5cf6'}[o.type]; ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,10*sc,0,Math.PI*2);ctx.fill();ctx.strokeStyle=S.pitch.selectedIdx===idx?'#fde047':'#fff';ctx.lineWidth=Math.max(1,2*sc);ctx.stroke();if(sc>0.4){ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(9.5*sc)}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(o.num??(o.type==='gk'?'В':'')),x,y+0.5);} }
      else if(o.type==='ball'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6*sc,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0f172a';ctx.lineWidth=1.2;ctx.stroke();}
      else if(o.type==='cone'){ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(x,y-7*sc);ctx.lineTo(x-6*sc,y+6*sc);ctx.lineTo(x+6*sc,y+6*sc);ctx.closePath();ctx.fill();}
      else if(o.type==='disc'){ctx.strokeStyle='#fde047';ctx.lineWidth=Math.max(1.5,2.8*sc);ctx.beginPath();ctx.ellipse(x,y,7*sc,4*sc,0,0,Math.PI*2);ctx.stroke();}
      else if(o.type==='minigoal'){
        const gw=28*sc,gd=14*sc; ctx.save();
        ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x,y+2*sc,gw/2+3*sc,gd/2+2*sc,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(240,253,244,0.42)'; ctx.beginPath(); ctx.moveTo(x-gw/2,y+gd/2); ctx.lineTo(x+gw/2,y+gd/2); ctx.lineTo(x+gw/2-4*sc,y-gd/2); ctx.lineTo(x-gw/2+4*sc,y-gd/2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=Math.max(.6,.9*sc); ctx.beginPath();
        for(let i=-3;i<=3;i++){ctx.moveTo(x+i*4*sc-3*sc,y+gd/2);ctx.lineTo(x+i*4*sc+3*sc,y-gd/2);ctx.moveTo(x+i*4*sc+3*sc,y+gd/2);ctx.lineTo(x+i*4*sc-3*sc,y-gd/2);}
        ctx.stroke(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=Math.max(1,1.4*sc);
        ctx.beginPath(); ctx.moveTo(x-gw/2,y+gd/2); ctx.lineTo(x-gw/2+4*sc,y-gd/2); ctx.lineTo(x+gw/2-4*sc,y-gd/2); ctx.lineTo(x+gw/2,y+gd/2); ctx.stroke();
        ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2,3.2*sc); ctx.beginPath(); ctx.moveTo(x-gw/2,y+gd/2); ctx.lineTo(x+gw/2,y+gd/2); ctx.stroke();
        ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(x-gw/2,y+gd/2,Math.max(2,3*sc),0,Math.PI*2); ctx.arc(x+gw/2,y+gd/2,Math.max(2,3*sc),0,Math.PI*2); ctx.fill();
        ctx.restore();
      } else if(o.type==='mannequin'){ctx.fillStyle='#facc15';ctx.strokeStyle='#0f172a';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y-6*sc,3.8*sc,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillRect(x-4.5*sc,y-2*sc,9*sc,11*sc);ctx.strokeRect(x-4.5*sc,y-2*sc,9*sc,11*sc);}
      else if(o.type==='ladder'){ctx.strokeStyle='#fb923c';ctx.lineWidth=Math.max(1,1.7*sc);ctx.strokeRect(x-20*sc,y-6*sc,40*sc,12*sc);for(let r=-12;r<=12;r+=6){ctx.beginPath();ctx.moveTo(x+r*sc,y-6*sc);ctx.lineTo(x+r*sc,y+6*sc);ctx.stroke();}}
      else if(o.type==='text'&&sc>0.4){ctx.fillStyle='rgba(15,23,42,0.82)';ctx.font=`700 ${Math.round(11*sc)}px Inter`;const tw=ctx.measureText(o.text).width+10;ctx.fillRect(x-tw/2,y-9*sc,tw,18*sc);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.text,x,y);}
    });
  }

  function pxToMeters(canvas, clientX, clientY) {
    const r=canvas.getBoundingClientRect(), W=canvas.width, H=canvas.height, isHalf=S.pitch.mode==='half';
    const px=(clientX-r.left)*(W/r.width), py=(clientY-r.top)*(H/r.height);
    const mScale=isHalf?Math.min((W-40)/68,(H-36)/52.5):Math.min((W-40)/105,(H-26)/68);
    const pW=isHalf?68*mScale:105*mScale, pH=isHalf?52.5*mScale:68*mScale, ox=(W-pW)/2, oy=isHalf?22:(H-pH)/2;
    const mx=(px-ox)/mScale, my=(py-oy)/mScale;
    return S.pitch.snapGrid ? {x:Math.round(mx),y:Math.round(my)} : {x:+mx.toFixed(1),y:+my.toFixed(1)};
  }

  let pitchDrag = null, pitchMovingIdx = -1, animRaf = null;
  function commitPitchSnapshot() {
    S.pitch.history.push(JSON.parse(JSON.stringify(S.pitch.frames[S.pitch.frameIdx])));
    if (S.pitch.history.length > 40) S.pitch.history.shift();
    S.pitch.redo = [];
  }

  function bindPitchCanvasEvents() {
    const canvas = document.getElementById('pitch-canvas'); if (!canvas) return;
    drawPitchCanvas(canvas);
    const findAt = (m) => {
      const items = S.pitch.frames[S.pitch.frameIdx];
      for(let i=items.length-1;i>=0;i--){const o=items[i]; if(o.type==='zone'){if(m.x>=o.x&&m.x<=o.x+o.w&&m.y>=o.y&&m.y<=o.y+o.h)return i;} else if(['arrow','run','dribble'].includes(o.type)){if(Math.hypot(m.x-(o.x1+o.x2)/2,m.y-(o.y1+o.y2)/2)<5)return i;} else if(Math.hypot(m.x-o.x,m.y-o.y)<3.8)return i;}
      return -1;
    };
    canvas.onpointerdown = async (e) => {
      e.preventDefault(); canvas.setPointerCapture(e.pointerId);
      const pos = pxToMeters(canvas,e.clientX,e.clientY), items = S.pitch.frames[S.pitch.frameIdx];
      if (S.pitch.tool==='erase') { const i=findAt(pos); if(i!==-1){commitPitchSnapshot();items.splice(i,1);drawPitchCanvas(canvas);saveLocal();} return; }
      if (S.pitch.tool==='move') { pitchMovingIdx=findAt(pos); S.pitch.selectedIdx=pitchMovingIdx; pitchDrag=pos; if(pitchMovingIdx!==-1) commitPitchSnapshot(); drawPitchCanvas(canvas); return; }
      if (S.pitch.tool==='text') {
        const txt = await uiPrompt('Введите подпись на поле:', '', 'Текстовая метка');
        if(txt&&txt.trim()){commitPitchSnapshot();items.push({type:'text',x:pos.x,y:pos.y,text:txt.trim().slice(0,24)});drawPitchCanvas(canvas);saveLocal();}
        return;
      }
      if (['arrow','run','dribble','zone'].includes(S.pitch.tool)) { pitchDrag=pos; return; }
      commitPitchSnapshot();
      const obj = { type:S.pitch.tool, x:pos.x, y:pos.y };
      if (['att','def','neu'].includes(S.pitch.tool)) obj.num = items.filter(x=>x.type===S.pitch.tool).length + 1;
      items.push(obj); drawPitchCanvas(canvas); saveLocal();
    };
    canvas.onpointermove = (e) => {
      if (S.pitch.tool==='move' && pitchMovingIdx!==-1 && pitchDrag) {
        const pos=pxToMeters(canvas,e.clientX,e.clientY), dx=pos.x-pitchDrag.x, dy=pos.y-pitchDrag.y, o=S.pitch.frames[S.pitch.frameIdx][pitchMovingIdx];
        if(['arrow','run','dribble'].includes(o.type)){o.x1+=dx;o.y1+=dy;o.x2+=dx;o.y2+=dy;} else {o.x+=dx;o.y+=dy;}
        pitchDrag=pos; drawPitchCanvas(canvas);
      }
    };
    canvas.onpointerup = (e) => {
      if (S.pitch.tool==='move') { pitchMovingIdx=-1; pitchDrag=null; saveLocal(); return; }
      if (pitchDrag && ['arrow','run','dribble','zone'].includes(S.pitch.tool)) {
        const pos=pxToMeters(canvas,e.clientX,e.clientY), items=S.pitch.frames[S.pitch.frameIdx];
        if (S.pitch.tool==='zone') { const x=Math.min(pitchDrag.x,pos.x),y=Math.min(pitchDrag.y,pos.y),w=Math.abs(pos.x-pitchDrag.x),h=Math.abs(pos.y-pitchDrag.y); if(w>2&&h>2){commitPitchSnapshot();items.push({type:'zone',x,y,w,h});} }
        else if (Math.hypot(pos.x-pitchDrag.x,pos.y-pitchDrag.y)>2) { commitPitchSnapshot(); items.push({type:S.pitch.tool,x1:pitchDrag.x,y1:pitchDrag.y,x2:pos.x,y2:pos.y}); }
        pitchDrag=null; drawPitchCanvas(canvas); saveLocal();
      }
    };
  }

  function playPitchAnimation() {
    const canvas = document.getElementById('pitch-canvas');
    if (!canvas || S.pitch.frames.length < 2) return showToast('Добавьте минимум 2 кадра (+ Дубль кадра)');
    if (S.pitch.playing) { S.pitch.playing=false; cancelAnimationFrame(animRaf); updatePitchUIOnly(); return; }
    S.pitch.playing = true;
    updatePitchUIOnly();
    const totalFrames=S.pitch.frames.length, segMs=950, startT=performance.now();
    const step = (now) => {
      if (!S.pitch.playing) return;
      const elapsed = now - startT;
      if (elapsed >= (totalFrames-1)*segMs) {
        S.pitch.playing=false;
        drawPitchCanvas(canvas, S.pitch.frames[totalFrames-1]); updatePitchUIOnly(); return;
      }
      const si = Math.floor(elapsed/segMs), tp = (elapsed%segMs)/segMs, fA=S.pitch.frames[si], fB=S.pitch.frames[si+1];
      const interp = fA.map((obj,idx)=>{ const nx=fB[idx]; if(!nx||nx.type!==obj.type||obj.x===undefined||nx.x===undefined) return obj; return {...obj,x:obj.x+(nx.x-obj.x)*tp,y:obj.y+(nx.y-obj.y)*tp}; });
      drawPitchCanvas(canvas, interp);
      animRaf = requestAnimationFrame(step);
    };
    animRaf = requestAnimationFrame(step);
  }

  /* =========================================================
     10. ЭКСПОРТ В ФОТО (PNG) И ФАЙЛ (PDF)
     ========================================================= */
  async function captureExportCanvas() {
    const el = document.getElementById('export-area') || DOM.main;
    if (!el) { showToast('Нет данных для экспорта'); return null; }
    if (!window.html2canvas) { showToast('Библиотека html2canvas не загружена'); return null; }

    const stage = document.createElement('div');
    stage.setAttribute('data-theme', 'light');
    stage.style.cssText = 'position:fixed;left:-99999px;top:0;background:#ffffff;color:#0f172a;padding:24px;z-index:-1;width:max-content;font-family:Inter,system-ui,sans-serif;';

    const clone = el.cloneNode(true);
    clone.style.background = '#ffffff';
    clone.style.color = '#0f172a';

    const origCanvases = el.querySelectorAll('canvas');
    const cloneCanvases = clone.querySelectorAll('canvas');
    origCanvases.forEach((origC, idx) => {
      const cc = cloneCanvases[idx];
      if (!cc) return;
      cc.width = origC.width;
      cc.height = origC.height;
      const ctx = cc.getContext('2d');
      if (ctx) {
        try { ctx.drawImage(origC, 0, 0); } catch {}
      }
    });

    const origFields = Array.from(el.querySelectorAll('textarea, select, input'));
    const cloneFields = Array.from(clone.querySelectorAll('textarea, select, input'));

    cloneFields.forEach((cf, idx) => {
      const orig = origFields[idx];
      if (!orig || cf.closest('.no-print')) return;

      if (orig.tagName === 'SELECT') {
        const val = orig.value;
        const txt = orig.options[orig.selectedIndex]?.text || '';
        const box = document.createElement('div');
        if (orig.classList.contains('day-sel')) {
          const pair = DAY_TYPE_COLORS[val];
          box.textContent = val || '—';
          box.style.cssText = `padding:6px 8px;border-radius:7px;font-size:11.5px;font-weight:700;text-align:center;border:1px solid #cbd5e1;background:${pair ? pair[0] : '#f8fafc'};color:${pair ? pair[1] : '#475569'};`;
        } else {
          box.textContent = txt;
          box.style.cssText = 'padding:5px 8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;background:#ffffff;color:#0f172a;';
        }
        cf.replaceWith(box);
      } else if (orig.tagName === 'TEXTAREA') {
        const box = document.createElement('div');
        box.textContent = orig.value || '';
        box.style.cssText = 'white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.4;padding:7px 9px;min-height:34px;color:#0f172a;';
        cf.replaceWith(box);
      } else if (orig.tagName === 'INPUT') {
        const box = document.createElement('div');
        let displayVal = orig.value || '';
        if (orig.type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(displayVal)) {
          const [y, m, d] = displayVal.split('-');
          displayVal = `${d}.${m}.${y}`;
        }
        box.textContent = displayVal;
        if (orig.classList.contains('task-inp')) {
          box.style.cssText = 'flex:1;font-size:11.5px;line-height:1.35;color:#0f172a;word-break:break-word;';
        } else if (orig.classList.contains('step-val-inp')) {
          box.style.cssText = 'flex:1;text-align:center;font-size:12px;font-weight:700;color:#0f172a;';
        } else {
          box.style.cssText = 'padding:6px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:12.5px;font-weight:600;background:#ffffff;color:#0f172a;min-height:32px;display:flex;align-items:center;';
        }
        cf.replaceWith(box);
      }
    });

    clone.querySelectorAll('.no-print').forEach(x => x.remove());
    clone.querySelectorAll('.table-wrap').forEach(tw => {
      tw.style.overflow = 'visible';
      tw.style.width = 'auto';
      tw.style.maxWidth = 'none';
    });
    clone.querySelectorAll('table.micro').forEach(tb => {
      tb.style.width = '1360px';
      tb.style.minWidth = '1360px';
      tb.style.background = '#ffffff';
    });
    clone.querySelectorAll('.panel, .panel-soft').forEach(p => {
      p.style.background = p.classList.contains('panel-soft') ? '#f8fafc' : '#ffffff';
      p.style.color = '#0f172a';
    });

    stage.appendChild(clone);
    document.body.appendChild(stage);

    try {
      const w = Math.ceil(stage.scrollWidth);
      const h = Math.ceil(stage.scrollHeight);
      return await window.html2canvas(stage, {
        scale: 2,
        backgroundColor: '#ffffff',
        width: w,
        height: h,
        windowWidth: w,
        windowHeight: h,
        scrollX: 0,
        scrollY: 0,
        useCORS: true,
        logging: false
      });
    } finally {
      stage.remove();
    }
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

        showToast('Фото (PNG) сохранено');

  async function exportPdf() {
    try {
      if (!window.jspdf?.jsPDF) return showToast('Библиотека jsPDF не загружена');
      showToast('Формирую файл (PDF)…');
      const canvas = await captureExportCanvas();
      if (!canvas) return;

      const { jsPDF } = window.jspdf;
      const isLandscape = canvas.width >= canvas.height;
      const pdf = new jsPDF({
        orientation: isLandscape ? 'landscape' : 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const pw = pdf.internal.pageSize.getWidth();
      const ph = pdf.internal.pageSize.getHeight();
      const margin = 7;
      const mw = pw - margin * 2;
      const mh = ph - margin * 2;
      const asp = canvas.width / canvas.height;

      let w = mw;
      let h = w / asp;
      if (h <= mh * 1.15) {
        if (h > mh) { h = mh; w = h * asp; }
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
      } else {
        const pagePxH = Math.floor(canvas.width * (mh / mw));
        let yPx = 0;
        let pageIdx = 0;
        while (yPx < canvas.height) {
          const sliceH = Math.min(pagePxH, canvas.height - yPx);
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = sliceH;
          sliceCanvas.getContext('2d').drawImage(canvas, 0, yPx, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
          if (pageIdx > 0) pdf.addPage();
          const sliceMmH = (sliceH / canvas.width) * mw;
          pdf.addImage(sliceCanvas.toDataURL('image/png'), 'PNG', margin, margin, mw, sliceMmH, undefined, 'FAST');
          yPx += sliceH;
          pageIdx++;
        }
      }

      const blob = pdf.output('blob');
      triggerBlobDownload(blob, `ProPlan_${S.tab}_${S.weekStart}.pdf`);
      showToast('Файл (PDF) сохранён');
    } catch (err) {
      showToast('Ошибка экспорта PDF: ' + (err?.message || 'неизвестно'));
    }
  }

  function runSelfTests() {
    const results = [];
    const assert = (name, cond) => results.push({ name, ok: Boolean(cond) });

    const lm = calcLoadMetrics([400,400,400,400,400,400,0]);
    assert('calcLoadMetrics weekSum == 2400', lm.weekSum === 2400);
