<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планирование недельного микроцикла</title>
  
  <!-- Библиотека для генерации фото (html2canvas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Библиотека для генерации PDF (jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #10b981;
      --accent-light: #ecfdf5;
      --accent-hover: #059669;
      --pdf-color: #e11d48;
      --pdf-hover: #be123c;
      --border: #e2e8f0;
      --border-input: #cbd5e1;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1540px;
      margin: 0 auto;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      background: var(--surface);
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #f1f5f9;
      color: #475569;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    .actions-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    button {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      user-select: none;
    }

    button svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
      flex-shrink: 0;
    }

    button:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-save-system {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid #059669;
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
    }
    .btn-save-system:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
    }

    .btn-library {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    .btn-library:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .badge-count {
      background: #e2e8f0;
      color: #334155;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 12px;
      font-weight: 700;
      margin-left: 2px;
    }

    .btn-export-png {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #0f172a;
    }
    .btn-export-png:hover {
      background: #1e293b;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.25);
    }

    .btn-export-pdf {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      border: 1px solid #e11d48;
      box-shadow: 0 2px 4px rgba(225, 29, 72, 0.2);
    }
    .btn-export-pdf:hover {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: #ffffff;
      box-shadow: 0 4px 8px rgba(225, 29, 72, 0.3);
    }

    .btn-danger {
      color: #e11d48;
      border-color: #fecdd3;
    }
    .btn-danger:hover {
      background: #fff1f2;
      border-color: #fda4af;
    }

    /* Вкладки */
    .tabs-wrapper {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      color: var(--text-muted);
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: none;
      margin-bottom: -2px;
    }

    .tab-btn:hover {
      background: transparent;
      color: var(--text-main);
      transform: none;
    }

    .tab-btn.active {
      color: #0f172a;
      border-bottom-color: #0f172a;
    }

    /* Рабочая область захвата */
    #capture-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-card);
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .doc-title-main {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .doc-role-subtitle {
      font-size: 14px;
      color: var(--accent-hover);
      font-weight: 600;
      margin-top: 4px;
    }

    .doc-watermark {
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .meta-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-input-box {
      width: 100%;
      min-height: 42px;
      background: #ffffff;
      border: 1px solid var(--border-input);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.4;
      outline: none;
      transition: all 0.15s ease-in-out;
      word-break: break-word;
      display: block;
    }

    .meta-input-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }

    .meta-input-box:empty:before {
      content: attr(data-placeholder);
      color: var(--text-subtle);
      font-weight: 400;
      pointer-events: none;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 1240px;
      background: var(--surface);
    }

    th, td {
      border: 1px solid var(--border);
      vertical-align: top;
      word-wrap: break-word;
    }

    th {
      background-color: #fafbfc;
      padding: 12px 8px;
      text-align: center;
    }

    .day-name {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .day-date {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      outline: none;
      display: inline-block;
      min-width: 58px;
      background: #f1f5f9;
      transition: all 0.15s;
    }

    .day-date:focus {
      background: var(--accent-light);
      color: var(--accent-hover);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .row-title-col {
      width: 220px;
      background-color: #fcfcfd;
      padding: 10px 14px;
      text-align: left;
      vertical-align: middle;
    }

    .row-title-num {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-subtle);
      margin-right: 6px;
    }

    .row-title-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .editable-cell {
      min-height: 42px;
      padding: 8px 10px;
      outline: none;
      font-size: 12.5px;
      line-height: 1.45;
      color: #334155;
      transition: background 0.15s;
    }

    .editable-cell:focus {
      background-color: #fbfdfc;
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    /* Виджет выпадающего списка (Тип дня) */
    .day-type-select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }
    .day-type-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
    }

    /* Виджет счетчика (+/-) */
    .stepper-widget {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    .stepper-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      box-shadow: none;
      transition: background 0.1s, transform 0.05s;
    }
    .stepper-btn:hover {
      background: #e2e8f0;
      transform: none;
    }
    .stepper-btn:active {
      background: #cbd5e1;
    }

    .stepper-val {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      padding: 2px 4px;
      white-space: nowrap;
    }

    .stepper-val[contenteditable="true"] {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 4px;
      cursor: text;
    }
    .stepper-val[contenteditable="true"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
    }

    /* Виджет структурированных задач (список подпунктов) */
    .tasks-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px;
      min-height: 52px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 8px;
      transition: border-color 0.15s;
    }

    .task-item:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.12);
    }

    .task-bullet {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      user-select: none;
      padding-top: 1px;
    }

    .task-text {
      flex: 1;
      outline: none;
      font-size: 12px;
      line-height: 1.35;
      color: #1e293b;
      min-height: 18px;
      word-break: break-word;
    }

    .task-text:empty:before {
      content: "Введите пункт...";
      color: var(--text-subtle);
    }

    .task-del-btn {
      opacity: 0.45;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: #ef4444;
      background: none;
      border: none;
      padding: 0 2px;
      box-shadow: none;
      display: inline-flex;
    }
    .task-del-btn:hover {
      opacity: 1;
      background: none;
      transform: none;
    }

    .task-add-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px dashed #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: none;
      width: 100%;
      margin-top: 2px;
    }
    .task-add-btn:hover {
      background: var(--accent-light);
      color: var(--accent-hover);
      border-color: var(--accent);
      transform: none;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 620px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px 8px;
      box-shadow: none;
    }

    .modal-body {
      padding: 18px 22px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .saved-item-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }

    .saved-item-card:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }

    .saved-item-info {
      flex: 1;
      min-width: 0;
    }

    .saved-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .saved-item-actions {
      display: flex;
      gap: 6px;
    }

    .modal-empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .actions-container {
        justify-content: flex-start;
      }
      .meta-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body { background: white; padding: 0; }
      .container { max-width: 100%; }
      .top-bar, .tabs-wrapper, .modal-overlay, .toast { display: none !important; }
      #capture-area { border: none; box-shadow: none; padding: 0; }
      .table-wrapper { overflow: visible; border: none; }
      .task-add-btn, .task-del-btn, .stepper-btn { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Панель управления -->
    <div class="top-bar">
      <div class="brand-title">
        Планирование микроцикла
        <span class="brand-badge">Football Pro</span>
      </div>

      <div class="actions-container">
        
        <!-- Сохранение в системе и список -->
        <div class="btn-group">
          <button class="btn-save-system" onclick="saveToSystemPrompt()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            Сохранить в системе
          </button>
          <button class="btn-library" onclick="openLibraryModal()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Мои циклы <span class="badge-count" id="cycles-count">0</span>
          </button>
        </div>

        <!-- Экспорт на телефон / ПК (Фото и PDF) -->
        <div class="btn-group">
          <button class="btn-export-png" id="btn-export-png" onclick="downloadImage()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Фото (PNG)
          </button>
          <button class="btn-export-pdf" id="btn-export-pdf" onclick="downloadPDF()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            Файл PDF
          </button>
        </div>

        <!-- Очистка данных -->
        <div class="btn-group">
          <button class="btn-danger" onclick="clearPlanMenu()" title="Очистить данные плана">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Очистить
          </button>
        </div>

      </div>
    </div>

    <!-- Вкладки по ролям тренеров -->
    <div class="tabs-wrapper">
      <button class="tab-btn active" onclick="switchTab('head', this)">Главный тренер</button>
      <button class="tab-btn" onclick="switchTab('gk', this)">Тренер по вратарям</button>
      <button class="tab-btn" onclick="switchTab('fitness', this)">Тренер по физподготовке</button>
    </div>

    <!-- Рабочая область -->
    <div id="capture-area">
      
      <!-- Заголовок -->
      <div class="doc-header">
        <div>
          <div class="doc-title-main">Планирование недельного микроцикла</div>
          <div class="doc-role-subtitle" id="role-title">Главный тренер — Недельный план</div>
        </div>
        <div class="doc-watermark">Weekly Microcycle Planning</div>
      </div>

      <!-- Блок общей информации -->
      <div class="meta-grid">
        <div class="meta-card">
          <label class="meta-label">Название команды</label>
          <div class="meta-input-box" contenteditable="true" data-meta="team" data-placeholder="Введите название команды..."></div>
        </div>
        <div class="meta-card">
          <label class="meta-label">Тип микроцикла</label>
          <div class="meta-input-box" contenteditable="true" data-meta="cycleType" data-placeholder="Например: Соревновательный / Втягивающий..."></div>
        </div>
      </div>

      <!-- Таблица недели -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="row-title-col"><span class="row-title-text">Параметры</span></th>
              <th><span class="day-name">Понедельник</span><span class="day-date" contenteditable="true" data-date="mon">ДД.ММ</span></th>
              <th><span class="day-name">Вторник</span><span class="day-date" contenteditable="true" data-date="tue">ДД.ММ</span></th>
              <th><span class="day-name">Среда</span><span class="day-date" contenteditable="true" data-date="wed">ДД.ММ</span></th>
              <th><span class="day-name">Четверг</span><span class="day-date" contenteditable="true" data-date="thu">ДД.ММ</span></th>
              <th><span class="day-name">Пятница</span><span class="day-date" contenteditable="true" data-date="fri">ДД.ММ</span></th>
              <th><span class="day-name">Суббота</span><span class="day-date" contenteditable="true" data-date="sat">ДД.ММ</span></th>
              <th><span class="day-name">Воскресенье</span><span class="day-date" contenteditable="true" data-date="sun">ДД.ММ</span></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Строки генерируются автоматически -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Модальное окно "Мои микроциклы" -->
  <div class="modal-overlay" id="libraryModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Сохранённые микроциклы</div>
        <button class="modal-close-btn" onclick="closeLibraryModal()">&times;</button>
      </div>
      <div class="modal-body" id="savedCyclesList">
        <!-- Список сохраненных микроциклов -->
      </div>
    </div>
  </div>

  <!-- Плавающее уведомление (Toast) -->
  <div class="toast" id="toast">
    <span id="toast-message">Сохранено</span>
  </div>

  <script>
    const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

    const dayTypes = [
      "— Выберите тип —",
      "Восстановительный",
      "Компенсаторный",
      "Развивающий",
      "Пиковый",
      "Скоростной",
      "Предматчевый",
      "Игровой",
      "Отдых"
    ];

    const roleNames = {
      head: "Главный тренер",
      gk: "Тренер по вратарям",
      fitness: "Тренер по физподготовке"
    };

    // Задачи переименованы в единственное число (требование 5)
    const roleRows = {
      head: [
        { id: 'dayType', title: 'Тип дня', type: 'dayType' },
        { id: 'weather', title: 'Погодные условия' },
        { id: 'playersCount', title: 'Количество футболистов', type: 'playersCount' },
        { id: 'startTime', title: 'Начало тренировки', type: 'startTime' },
        { id: 'duration', title: 'Длительность', type: 'duration' },
        { id: 'techTactical', title: 'Технико-тактическая задача', type: 'tasks' },
        { id: 'physical', title: 'Физическая задача', type: 'tasks' },
        { id: 'cognitive', title: 'Когнитивная задача', type: 'tasks' },
        { id: 'benchmarks', title: 'Ориентиры' },
        { id: 'intensity', title: 'Интенсивность' }
      ],
      gk: [
        { id: 'dayType', title: 'Тип дня', type: 'dayType' },
        { id: 'weather', title: 'Погодные условия' },
        { id: 'playersCount', title: 'Количество футболистов', type: 'playersCount' },
        { id: 'startTime', title: 'Начало тренировки', type: 'startTime' },
        { id: 'duration', title: 'Длительность', type: 'duration' },
        { id: 'techTactical', title: 'Технико-тактическая задача', type: 'tasks' },
        { id: 'physical', title: 'Физическая задача', type: 'tasks' },
        { id: 'cognitive', title: 'Когнитивная задача', type: 'tasks' },
        { id: 'benchmarks', title: 'Ориентиры' },
        { id: 'prevention', title: 'Профилактика' },
        { id: 'individual', title: 'Индивидуальная работа' },
        { id: 'volume', title: 'Объём' },
        { id: 'intensity', title: 'Интенсивность' },
        { id: 'monitoring', title: 'Мониторинг' },
        { id: 'notes', title: 'Примечания' }
      ],
      fitness: [
        { id: 'dayType', title: 'Тип дня', type: 'dayType' },
        { id: 'playerGroup', title: 'Группа игроков' },
        { id: 'playersCount', title: 'Количество футболистов', type: 'playersCount' },
        { id: 'startTime', title: 'Начало тренировки', type: 'startTime' },
        { id: 'duration', title: 'Длительность', type: 'duration' },
        { id: 'techTactical', title: 'Технико-тактическая задача', type: 'tasks' },
        { id: 'physical', title: 'Физическая задача', type: 'tasks' },
        { id: 'cognitive', title: 'Когнитивная задача', type: 'tasks' },
        { id: 'prevention', title: 'Профилактика' },
        { id: 'individual', title: 'Индивидуальная работа' },
        { id: 'volume', title: 'Объем' },
        { id: 'intensity', title: 'Интенсивность' },
        { id: 'monitoring', title: 'Мониторинг' },
        { id: 'notes', title: 'Примечания' }
      ]
    };

    let currentTab = 'head';

    let appData = {
      meta: { team: "", cycleType: "" },
      dates: {},
      head: {},
      gk: {},
      fitness: {}
    };

    function init() {
      const saved = localStorage.getItem('football_microcycle_last_active');
      if (saved) {
        try {
          appData = Object.assign(appData, JSON.parse(saved));
        } catch(e) {
          console.error(e);
        }
      }

      renderTableBody();
      loadTabContent();
      updateCyclesBadge();

      // Автосохранение при вводе
      document.getElementById('capture-area').addEventListener('input', () => {
        saveCurrentTabToMemory();
        localStorage.setItem('football_microcycle_last_active', JSON.stringify(appData));
      });
      document.getElementById('capture-area').addEventListener('change', () => {
        saveCurrentTabToMemory();
        localStorage.setItem('football_microcycle_last_active', JSON.stringify(appData));
      });
    }

    function renderTableBody() {
      const tbody = document.getElementById('table-body');
      const rows = roleRows[currentTab] || [];
      
      let html = '';
      rows.forEach((row, index) => {
        const num = String(index + 1).padStart(2, '0');
        html += `
          <tr>
            <td class="row-title-col">
              <span class="row-title-num">${num}</span>
              <span class="row-title-text">${row.title}</span>
            </td>
            ${days.map(day => `
              <td class="cell-wrapper" data-row-type="${row.type || 'text'}" data-row-id="${row.id}" data-day="${day}">
                ${renderCellControl(row.type, `${row.id}-${day}`)}
              </td>
            `).join('')}
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function renderCellControl(type, cellKey) {
      // 1. Выпадающий список типов дня
      if (type === 'dayType') {
        return `
          <select class="day-type-select" data-cell="${cellKey}">
            ${dayTypes.map(t => `<option value="${t === '— Выберите тип —' ? '' : t}">${t}</option>`).join('')}
          </select>
        `;
      }
      
      // 2. Количество футболистов (от 0 до 50, шаг 1, без ручного ввода)
      if (type === 'playersCount') {
        return `
          <div class="stepper-widget" data-stepper-type="players" data-cell="${cellKey}">
            <button type="button" class="stepper-btn" onclick="stepCount('${cellKey}', -1)">−</button>
            <span class="stepper-val" id="val-${cellKey}">0</span>
            <button type="button" class="stepper-btn" onclick="stepCount('${cellKey}', 1)">+</button>
          </div>
        `;
      }

      // 3. Начало тренировки (шаг 30 минут, без ручного ввода)
      if (type === 'startTime') {
        return `
          <div class="stepper-widget" data-stepper-type="time" data-cell="${cellKey}">
            <button type="button" class="stepper-btn" onclick="stepTime('${cellKey}', -30)">−</button>
            <span class="stepper-val" id="val-${cellKey}">10:00</span>
            <button type="button" class="stepper-btn" onclick="stepTime('${cellKey}', 30)">+</button>
          </div>
        `;
      }

      // 4. Длительность (шаг 10 минут, минимум 0, С возможностью ручного ввода)
      if (type === 'duration') {
        return `
          <div class="stepper-widget" data-stepper-type="duration" data-cell="${cellKey}">
            <button type="button" class="stepper-btn" onclick="stepDuration('${cellKey}', -10)">−</button>
            <span class="stepper-val" id="val-${cellKey}" contenteditable="true" onblur="validateDuration(this)">90 мин</span>
            <button type="button" class="stepper-btn" onclick="stepDuration('${cellKey}', 10)">+</button>
          </div>
        `;
      }

      // 5. Задачи с возможностью добавления подпунктов
      if (type === 'tasks') {
        return `
          <div class="tasks-container" id="tasks-${cellKey}" data-cell="${cellKey}">
            <div class="tasks-list" id="list-${cellKey}"></div>
            <button type="button" class="task-add-btn" onclick="addTaskItem('${cellKey}', '')">
              + добавить задачу
            </button>
          </div>
        `;
      }

      // Обычная текстовая ячейка
      return `<div class="editable-cell" contenteditable="true" data-cell="${cellKey}"></div>`;
    }

    /* --- ЛОГИКА ВИДЖЕТОВ --- */

    // 2. Игроки (0..50)
    function stepCount(cellKey, delta) {
      const el = document.getElementById(`val-${cellKey}`);
      if (!el) return;
      let val = parseInt(el.innerText, 10);
      if (isNaN(val)) val = 0;
      val = Math.max(0, Math.min(50, val + delta));
      el.innerText = val;
      triggerAutoSave();
    }

    // 3. Время (шаг 30 мин)
    function stepTime(cellKey, deltaMinutes) {
      const el = document.getElementById(`val-${cellKey}`);
      if (!el) return;
      let text = el.innerText.trim();
      let parts = text.split(':');
      let hours = parseInt(parts[0], 10);
      let mins = parseInt(parts[1], 10);
      if (isNaN(hours)) hours = 10;
      if (isNaN(mins)) mins = 0;

      let totalMins = hours * 60 + mins + deltaMinutes;
      if (totalMins < 0) totalMins = 24 * 60 + totalMins;
      totalMins = totalMins % (24 * 60);

      const newH = String(Math.floor(totalMins / 60)).padStart(2, '0');
      const newM = String(totalMins % 60).padStart(2, '0');
      el.innerText = `${newH}:${newM}`;
      triggerAutoSave();
    }

    // 4. Длительность (шаг 10 мин, минимум 0, ручной ввод)
    function stepDuration(cellKey, deltaMinutes) {
      const el = document.getElementById(`val-${cellKey}`);
      if (!el) return;
      let val = parseInt(el.innerText.replace(/\D/g, ''), 10);
      if (isNaN(val)) val = 0;
      val = Math.max(0, val + deltaMinutes);
      el.innerText = `${val} мин`;
      triggerAutoSave();
    }

    function validateDuration(el) {
      let val = parseInt(el.innerText.replace(/\D/g, ''), 10);
      if (isNaN(val) || val < 0) val = 0;
      el.innerText = `${val} мин`;
      triggerAutoSave();
    }

    // 5. Задачи (подпункты)
    function addTaskItem(cellKey, text = '') {
      const container = document.getElementById(`list-${cellKey}`);
      if (!container) return;
      
      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML = `
        <span class="task-bullet">•</span>
        <div class="task-text" contenteditable="true">${escapeHtml(text)}</div>
        <button type="button" class="task-del-btn" title="Удалить пункт" onclick="this.parentElement.remove(); triggerAutoSave();">×</button>
      `;
      container.appendChild(item);
      
      const textEl = item.querySelector('.task-text');
      textEl.addEventListener('input', triggerAutoSave);
      
      if (!text) {
        textEl.focus();
      }
      triggerAutoSave();
    }

    function triggerAutoSave() {
      saveCurrentTabToMemory();
      localStorage.setItem('football_microcycle_last_active', JSON.stringify(appData));
    }

    /* --- СОХРАНЕНИЕ / ЗАГРУЗКА ДАННЫХ ВКЛАДОК --- */

    function saveCurrentTabToMemory() {
      if (!appData.meta) appData.meta = {};
      document.querySelectorAll('.meta-input-box').forEach(el => {
        const key = el.getAttribute('data-meta');
        appData.meta[key] = el.innerText.trim();
      });

      if (!appData.dates) appData.dates = {};
      document.querySelectorAll('.day-date').forEach(el => {
        appData.dates[el.getAttribute('data-date')] = el.innerText.trim();
      });

      if (!appData[currentTab]) appData[currentTab] = {};

      // 1. Обычные ячейки
      document.querySelectorAll('.editable-cell').forEach(el => {
        const key = el.getAttribute('data-cell');
        appData[currentTab][key] = el.innerHTML;
      });

      // 2. Тип дня (select)
      document.querySelectorAll('.day-type-select').forEach(el => {
        const key = el.getAttribute('data-cell');
        appData[currentTab][key] = el.value;
      });

      // 3. Счетчики (игроки, время, длительность)
      document.querySelectorAll('.stepper-widget').forEach(el => {
        const key = el.getAttribute('data-cell');
        const valEl = document.getElementById(`val-${key}`);
        if (valEl) {
          appData[currentTab][key] = valEl.innerText.trim();
        }
      });

      // 4. Списки задач (массив строк)
      document.querySelectorAll('.tasks-list').forEach(list => {
        const cellKey = list.id.replace('list-', '');
        const items = [];
        list.querySelectorAll('.task-text').forEach(t => {
          items.push(t.innerText.trim());
        });
        appData[currentTab][cellKey] = items;
      });
    }

    function loadTabContent() {
      document.getElementById('role-title').innerText = `${roleNames[currentTab]} — Недельный план`;

      document.querySelectorAll('.meta-input-box').forEach(el => {
        const key = el.getAttribute('data-meta');
        el.innerText = (appData.meta && appData.meta[key]) ? appData.meta[key] : "";
      });

      document.querySelectorAll('.day-date').forEach(el => {
        const key = el.getAttribute('data-date');
        el.innerText = (appData.dates && appData.dates[key]) ? appData.dates[key] : "ДД.ММ";
      });

      const tabData = appData[currentTab] || {};

      // Обычные ячейки
      document.querySelectorAll('.editable-cell').forEach(el => {
        const key = el.getAttribute('data-cell');
        el.innerHTML = tabData[key] || "";
      });

      // Типы дней
      document.querySelectorAll('.day-type-select').forEach(el => {
        const key = el.getAttribute('data-cell');
        el.value = tabData[key] || "";
      });

      // Счетчики
      document.querySelectorAll('.stepper-widget').forEach(el => {
        const key = el.getAttribute('data-cell');
        const type = el.getAttribute('data-stepper-type');
        const valEl = document.getElementById(`val-${key}`);
        if (valEl) {
          if (tabData[key] !== undefined && tabData[key] !== "") {
            valEl.innerText = tabData[key];
          } else {
            if (type === 'players') valEl.innerText = '0';
            else if (type === 'time') valEl.innerText = '10:00';
            else if (type === 'duration') valEl.innerText = '90 мин';
          }
        }
      });

      // Задачи (подпункты)
      document.querySelectorAll('.tasks-list').forEach(list => {
        const cellKey = list.id.replace('list-', '');
        list.innerHTML = '';
        const savedList = tabData[cellKey];
        if (Array.isArray(savedList)) {
          savedList.forEach(text => addTaskItem(cellKey, text));
        }
      });
    }

    function switchTab(roleKey, btnElement) {
      saveCurrentTabToMemory();
      currentTab = roleKey;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      renderTableBody();
      loadTabContent();
    }

    /* --- БИБЛИОТЕКА МИКРОЦИКЛОВ (ИСПРАВЛЕНО СОХРАНЕНИЕ МНОЖЕСТВА ЦИКЛОВ) --- */

    function getSavedCycles() {
      try {
        return JSON.parse(localStorage.getItem('football_saved_cycles_library') || '[]');
      } catch (e) {
        return [];
      }
    }

    function updateCyclesBadge() {
      const list = getSavedCycles();
      document.getElementById('cycles-count').innerText = list.length;
    }

    // Сохраняет каждый раз как НОВЫЙ независимый микроцикл в библиотеку (требование 8)
    function saveToSystemPrompt() {
      saveCurrentTabToMemory();
      const defaultName = `${appData.meta.team || 'Команда'} — ${appData.meta.cycleType || 'Микроцикл'}`;
      const name = prompt("Введите название для сохранения микроцикла в системе:", defaultName);
      
      if (!name || !name.trim()) return;

      const cycles = getSavedCycles();
      const newEntry = {
        id: 'cycle_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        name: name.trim(),
        date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        data: JSON.parse(JSON.stringify(appData))
      };

      cycles.unshift(newEntry);
      localStorage.setItem('football_saved_cycles_library', JSON.stringify(cycles));
      updateCyclesBadge();
      showToast(`Микроцикл «${newEntry.name}» успешно сохранён!`);
    }

    function openLibraryModal() {
      const modal = document.getElementById('libraryModal');
      const container = document.getElementById('savedCyclesList');
      const cycles = getSavedCycles();

      if (cycles.length === 0) {
        container.innerHTML = `
          <div class="modal-empty">
            У вас пока нет сохранённых микроциклов.<br>
            Заполните параметры и нажмите <b>«Сохранить в системе»</b>.
          </div>
        `;
      } else {
        container.innerHTML = cycles.map(c => `
          <div class="saved-item-card">
            <div class="saved-item-info">
              <div class="saved-item-name">${escapeHtml(c.name)}</div>
              <div class="saved-item-sub">Сохранено: ${c.date}</div>
            </div>
            <div class="saved-item-actions">
              <button onclick="loadSavedCycle('${c.id}')" style="background:#0f172a; color:#fff; border:none; padding:6px 12px; font-size:12px;">Открыть</button>
              <button onclick="deleteSavedCycle('${c.id}')" class="btn-danger" style="padding:6px 10px; font-size:12px;">Удалить</button>
            </div>
          </div>
        `).join('');
      }

      modal.classList.add('active');
    }

    function closeLibraryModal() {
      document.getElementById('libraryModal').classList.remove('active');
    }

    function loadSavedCycle(id) {
      const cycles = getSavedCycles();
      const cycle = cycles.find(c => c.id === id);
      if (!cycle) return;

      appData = JSON.parse(JSON.stringify(cycle.data));
      renderTableBody();
      loadTabContent();
      closeLibraryModal();
      showToast(`Загружен микроцикл: «${cycle.name}»`);
    }

    function deleteSavedCycle(id) {
      if (!confirm("Удалить этот микроцикл из системы?")) return;
      let cycles = getSavedCycles();
      cycles = cycles.filter(c => c.id !== id);
      localStorage.setItem('football_saved_cycles_library', JSON.stringify(cycles));
      updateCyclesBadge();
      openLibraryModal();
      showToast("Микроцикл удален");
    }

    /* --- ПОЛНАЯ / ЧАСТИЧНАЯ ОЧИСТКА (ТРЕБОВАНИЕ 7) --- */

    function clearPlanMenu() {
      const choice = confirm(
        "Нажмите «ОК», чтобы ПОЛНОСТЬЮ очистить ВСЕ поля (все тренеры, даты и название команды).\n\n" +
        "Или нажмите «Отмена», чтобы очистить только текущую вкладку."
      );

      if (choice) {
        // Полная очистка
        appData = {
          meta: { team: "", cycleType: "" },
          dates: {},
          head: {},
          gk: {},
          fitness: {}
        };
        localStorage.removeItem('football_microcycle_last_active');
        renderTableBody();
        loadTabContent();
        showToast("Все данные микроцикла полностью очищены!");
      } else {
        const clearCurrent = confirm(`Очистить только поля текущей вкладки «${roleNames[currentTab]}»?`);
        if (clearCurrent) {
          appData[currentTab] = {};
          renderTableBody();
          loadTabContent();
          showToast(`Вкладка «${roleNames[currentTab]}» очищена`);
        }
      }
    }

    /* --- ЭКСПОРТ (PNG / PDF) --- */

    async function generateCanvas() {
      saveCurrentTabToMemory();
      const area = document.getElementById('capture-area');

      return await html2canvas(area, {
        scale: 2.2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        onclone: (clonedDoc) => {
          const clonedArea = clonedDoc.getElementById('capture-area');
          clonedArea.style.width = '1480px';
          clonedArea.style.minWidth = '1480px';
          clonedArea.style.maxWidth = '1480px';
          clonedArea.style.padding = '32px';

          // Скрываем служебные кнопки списков и виджетов при создании фото/PDF
          clonedArea.querySelectorAll('.task-add-btn, .task-del-btn, .stepper-btn').forEach(btn => {
            btn.style.display = 'none';
          });

          // Для селектов заменяем на простой текст для идеальной отрисовки
          clonedArea.querySelectorAll('.day-type-select').forEach(sel => {
            const val = sel.value;
            const span = clonedDoc.createElement('div');
            span.style.fontWeight = '600';
            span.style.fontSize = '12px';
            span.style.textAlign = 'center';
            span.innerText = val || '—';
            sel.parentNode.replaceChild(span, sel);
          });

          const wrapper = clonedArea.querySelector('.table-wrapper');
          if (wrapper) {
            wrapper.style.overflow = 'visible';
            wrapper.style.width = '100%';
          }

          const table = clonedArea.querySelector('table');
          if (table) {
            table.style.width = '100%';
            table.style.minWidth = '100%';
          }
        }
      });
    }

    async function downloadImage() {
      const btn = document.getElementById('btn-export-png');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>⏳ Создание фото...</span>';
      btn.style.pointerEvents = 'none';

      try {
        const canvas = await generateCanvas();
        const team = (appData.meta?.team || 'Команда').replace(/\s+/g, '_');
        const filename = `Микроцикл_${team}_${roleNames[currentTab]}.png`;

        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Фото успешно загружено!");
      } catch (err) {
        console.error('Ошибка PNG:', err);
        alert('Не удалось сформировать фото. Попробуйте еще раз.');
      } finally {
        btn.innerHTML = originalText;
        btn.style.pointerEvents = 'auto';
      }
    }

    async function downloadPDF() {
      const btn = document.getElementById('btn-export-pdf');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>⏳ Создание PDF...</span>';
      btn.style.pointerEvents = 'none';

      try {
        const canvas = await generateCanvas();
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a4'
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 8;
        const maxW = pageWidth - margin * 2;
        const maxH = pageHeight - margin * 2;

        const imgAspect = canvas.width / canvas.height;
        let imgW = maxW;
        let imgH = imgW / imgAspect;

        if (imgH > maxH) {
          imgH = maxH;
          imgW = imgH * imgAspect;
        }

        const posX = margin + (maxW - imgW) / 2;
        const posY = margin + (maxH - imgH) / 2;

        pdf.addImage(imgData, 'PNG', posX, posY, imgW, imgH, undefined, 'FAST');

        const team = (appData.meta?.team || 'Команда').replace(/\s+/g, '_');
        pdf.save(`Микроцикл_${team}_${roleNames[currentTab]}.pdf`);
        showToast("PDF-файл успешно скачан!");
      } catch (err) {
        console.error('Ошибка PDF:', err);
        alert('Не удалось сформировать PDF.');
      } finally {
        btn.innerHTML = originalText;
        btn.style.pointerEvents = 'auto';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    document.getElementById('libraryModal').addEventListener('click', (e) => {
      if (e.target.id === 'libraryModal') closeLibraryModal();
    });

    init();
  </script>
</body>
