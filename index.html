    if (act==='load-session') { const ss=S.savedSessions[+btn.getAttribute('data-idx')]; if(ss){ S.sessionMeta=JSON.parse(JSON.stringify(ss.meta)); S.sections=JSON.parse(JSON.stringify(ss.sections)); renderBuilder(); showToast('Конспект загружен'); } return; }
    if (act==='del-session') { S.savedSessions.splice(+btn.getAttribute('data-idx'),1); saveLocal(); return renderBuilder(); }

    if (act==='add-match') {
      const date=document.getElementById('m-date').value, kickoff=document.getElementById('m-time').value, opponent=document.getElementById('m-opp').value.trim(), competition=document.getElementById('m-comp').value.trim(), homeAway=document.getElementById('m-ha').value;
      if(!date||!opponent) return showToast('Укажите дату и соперника');
      const m={id:'m_'+Date.now(),date,kickoff,opponent,competition,homeAway};
      if(S.mode==='cloud'&&sb&&S.team){ const{data}=await sbCall(sb.from('matches').insert({team_id:S.team.id,date,kickoff,opponent,home_away:homeAway,competition}).select().single(), 'Добавление матча'); if(data)m.id=data.id; }
      S.matches.push(m); saveLocal(); return renderCalendar();
    }
    if (act==='del-match') { const id=btn.getAttribute('data-id'); S.matches=S.matches.filter(m=>m.id!==id); if(S.mode==='cloud'&&sb) await sbCall(sb.from('matches').delete().eq('id',id), 'Удаление матча'); saveLocal(); return renderCalendar(); }

    if (act==='copy-code') { navigator.clipboard?.writeText(S.team?.inviteCode||'').catch(()=>{}); return showToast('Код скопирован'); }
    if (act==='regen-code') {
      const nc=genInviteCode();
      if(S.mode==='cloud'&&sb&&S.team){
        const {error}=await sbCall(sb.from('team_invites').insert({team_id:S.team.id,code:nc}), 'Генерация кода');
        if(error) return;
        await sb.from('team_invites').delete().eq('team_id',S.team.id).neq('code',nc);
      }
      S.team.inviteCode=nc; saveLocal(); return renderTeam();
    }
    if (act==='create-team' && S.mode==='cloud' && sb) {
      const name=document.getElementById('ct-name').value.trim(), cat=document.getElementById('ct-cat').value.trim();
      if(!name) return showToast('Введите название команды');
      const {error} = await sbCall(sb.rpc('create_team',{p_name:name,p_category:cat}), 'Создание команды');
      if(error) return;
      await loadCloudWorkspace(); return showToast('Команда создана');
    }
    if (act==='join-team') {
      const code=normalizeInviteCode(document.getElementById('join-code-inp').value), role=document.getElementById('join-role-inp').value;
      if (S.mode==='cloud' && sb) {
        const res = await sbCall(sb.rpc('join_team',{p_code:code,p_role:role}), 'Подключение к команде');
        if (res.error) return;
        if (res.data?.error) return showToast(JOIN_ERRORS[res.data.error] || res.data.error);
        await loadCloudWorkspace(); return showToast('Подключено к команде');
      } else return showToast('Для подключения по коду войдите в аккаунт');
    }
    if (act==='go-role') { S.tab=btn.getAttribute('data-role'); if(S.tab==='assistant') S.activeSlot=btn.getAttribute('data-slot'); return renderAll(); }

    if (act==='sb-login' && sb) {
      const email=document.getElementById('au-email').value.trim(), password=document.getElementById('au-pass').value;
      const {data,error} = await sbCall(sb.auth.signInWithPassword({email,password}), 'Вход');
      if(error) return;
      S.mode='cloud'; S.user={id:data.user.id,email:data.user.email,fullName:data.user.user_metadata?.full_name||email};
      closeModal(); await loadCloudWorkspace(); return showToast('Вход выполнен');
    }
    if (act==='sb-reg' && sb) {
      const fullName=document.getElementById('au-rname').value.trim(), email=document.getElementById('au-remail').value.trim(), password=document.getElementById('au-rpass').value;
      if (S.siteSettings.signupDisabled) return showToast('Регистрация закрыта');
      if (password.length < 8) return showToast('Пароль должен быть не короче 8 символов');
      const {error} = await sbCall(sb.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:location.origin}}), 'Регистрация');
      if(error) return;
      return showToast('Письмо для подтверждения отправлено на ' + email);
    }
    if (act==='sb-magic' && sb) {
      const email=document.getElementById('au-email').value.trim();
      const {error} = await sbCall(sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin}}), 'Отправка ссылки');
      if(error) return;
      return showToast('Ссылка отправлена на ' + email);
    }
    if (act==='sb-reset' && sb) {
      const email=document.getElementById('au-email').value.trim();
      if(!email) return showToast('Введите Email');
      const {error} = await sbCall(sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin}), 'Сброс пароля');
      if(error) return;
      return showToast('Ссылка для сброса пароля отправлена на ' + email);
    }
    if (act==='logout' && sb) {
      await sb.auth.signOut();
      if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; }
      S.user=null; S.isSuperAdmin=false; if(S.tab==='admin') S.tab='head';
      S.team=null; S.members=[]; S.comments=[]; S.auditLog=[]; S.cells={}; S.serverVer={}; S.mode='local';
      closeModal(); loadLocal(); return renderAll();
    }
    if (act==='save-admin-settings') {
      if (!S.isSuperAdmin) return showToast('Нет прав администратора');
      S.siteSettings.brandName=document.getElementById('adm-bname').value.trim()||'ProPlan';
      S.siteSettings.brandBadge=document.getElementById('adm-bbadge').value.trim()||'GoProduction';
      S.siteSettings.announcement=document.getElementById('adm-bann').value.trim();
      S.siteSettings.readOnly=document.getElementById('adm-ro').checked;
      if (S.mode==='cloud' && sb) {
        const res = await sb.functions.invoke('admin-actions',{body:{action:'update_site_settings',brandName:S.siteSettings.brandName,brandBadge:S.siteSettings.brandBadge,announcement:S.siteSettings.announcement,signupDisabled:S.siteSettings.signupDisabled,readOnly:S.siteSettings.readOnly}});
        if (res.error) await sbCall(sb.from('site_settings').update({brand_name:S.siteSettings.brandName,brand_badge:S.siteSettings.brandBadge,announcement:S.siteSettings.announcement,read_only:S.siteSettings.readOnly}).eq('id',1), 'Настройки');
      }
      recordAudit('admin_settings_saved', S.siteSettings.brandName);
      saveLocal(); renderAll(); return showToast('Настройки применены');
    }
    if (act==='run-self-tests') {
      if (!S.isSuperAdmin) return;
      const res = runSelfTests();
      return openModal(`Автотесты (${res.passed}/${res.total})`, res.results.map(r => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;">${r.ok?'✅':'❌'} ${esc(r.name)}</div>`).join(''));
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.hasAttribute('data-cell-row') && !el.classList.contains('task-inp')) {
      setCell(el.getAttribute('data-cell-role'), el.getAttribute('data-cell-slot'), el.getAttribute('data-cell-day'), el.getAttribute('data-cell-row'), el.value);
      if (el.classList.contains('day-sel')) el.setAttribute('data-v', el.value);
    }
    if (el.getAttribute('data-act')==='edit-dur') {
      const v = Math.max(0, parseInt(el.value.replace(/\D/g,''),10)||0);
      el.value = `${v} мин`;
      setCell(el.getAttribute('data-cell-role'), el.getAttribute('data-cell-slot'), el.getAttribute('data-cell-day'), el.getAttribute('data-cell-row'), el.value);
    }
    if (el.getAttribute('data-act')==='set-week-start') { S.weekStart=el.value; saveLocal(); renderMicrocycle(); }
    if (el.getAttribute('data-act')==='set-cycle-type') { S.cycleType=el.value; saveLocal(); }
    if (el.getAttribute('data-act')==='set-team-name' && S.team) { S.team.name=el.value; saveLocal(); renderShell(); }
    if (el.getAttribute('data-act')==='set-approval') {
      const prev=S.approvalStatus; S.approvalStatus=el.value; recordAudit('approval_changed', el.value, prev, el.value); saveLocal(); renderMicrocycle();
      if (S.mode==='cloud' && sb && S.team?.microcycleId) {
        sb.from('microcycles').update({approval_status:el.value}).eq('id',S.team.microcycleId).then(({error})=>{
          if (error) { S.approvalStatus=prev; renderMicrocycle(); showToast(error.message); }
        });
      }
    }
    if (el.getAttribute('data-act')==='mon-day') { S.selectedMonDay=el.value; renderAll(); }
    if (el.getAttribute('data-act')==='player-status') { const p=S.players.find(x=>x.id===el.getAttribute('data-id')); if(p){p.status=el.value; saveLocal(); renderMonitoring();} }
    if (el.hasAttribute('data-mon-field')) {
      const pid=el.getAttribute('data-pid'), f=el.getAttribute('data-mon-field');
      if(!S.playerLogs[S.selectedMonDay]) S.playerLogs[S.selectedMonDay]={};
      if(!S.playerLogs[S.selectedMonDay][pid]) S.playerLogs[S.selectedMonDay][pid]={rpe:0,sleep:4,fatigue:4,soreness:4,stress:4,distance:0,hsr:0};
      let val = +el.value || 0;
      if (f === 'rpe') val = Math.max(0, Math.min(10, val));
      if (['sleep','fatigue','soreness','stress'].includes(f)) val = Math.max(1, Math.min(5, val));
      if (['distance','hsr'].includes(f)) val = Math.max(0, val);
      S.playerLogs[S.selectedMonDay][pid][f] = val;
      saveLocal();
      updateMonitoringRowInPlace(pid);
    }
    if (el.hasAttribute('data-smeta')) { S.sessionMeta[el.getAttribute('data-smeta')]=el.value; saveLocal(); if(el.tagName==='SELECT') renderBuilder(); }
    if (el.getAttribute('data-act')==='drill-dur') { const s=S.sections.find(x=>x.id===el.getAttribute('data-sec')); if(s){s.drills[+el.getAttribute('data-di')].dur=+el.value||10; saveLocal(); renderBuilder();} }
    if (el.getAttribute('data-act')==='pitch-mode') { S.pitch.mode=el.value; saveLocal(); updatePitchUIOnly(); }
    if (el.getAttribute('data-act')==='ex-filter') { S.exFilter=el.value; updateExLibraryPartial(); }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.classList.contains('task-inp')) {
      const r=el.getAttribute('data-cell-role'), sl=el.getAttribute('data-cell-slot'), d=el.getAttribute('data-cell-day'), row=el.getAttribute('data-cell-row'), ti=+el.getAttribute('data-task-idx');
      const arr=[...(Array.isArray(getCell(r,sl,d,row))?getCell(r,sl,d,row):[])]; arr[ti]=el.value; setCell(r,sl,d,row,arr);
    } else if (el.classList.contains('cell-input')) {
      setCell(el.getAttribute('data-cell-role'), el.getAttribute('data-cell-slot'), el.getAttribute('data-cell-day'), el.getAttribute('data-cell-row'), el.value);
    } else if (el.getAttribute('data-act')==='ex-search') {
      debouncedExSearch(el.value);
    }
  });

  document.getElementById('gps-csv-input').onchange = (ev) => {
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const rows = parseCsvRows(rd.result);
      let imported=0;
      rows.slice(1).forEach(cols => {
        const name=(cols[0]||'').trim(), dist=Math.max(0, Number(cols[1])||0), hsr=Math.max(0, Number(cols[2])||0);
        if (!name) return;
        const p=S.players.find(x=>x.fullName.toLowerCase().includes(name.toLowerCase()));
        if(p){
          if(!S.playerLogs[S.selectedMonDay]) S.playerLogs[S.selectedMonDay]={};
          S.playerLogs[S.selectedMonDay][p.id]=Object.assign(S.playerLogs[S.selectedMonDay][p.id]||{rpe:6,sleep:4,fatigue:4,soreness:4,stress:4},{distance:dist,hsr});
          imported++;
        }
      });
      saveLocal(); renderMonitoring(); showToast(`Импортировано GPS-строк: ${imported}`);
    };
    rd.readAsText(f); ev.target.value='';
  };

  document.addEventListener('keydown', (e) => {
    if (e.key==='Escape') {
      if (DOM.dialog.classList.contains('open') && DOM.dialogCloseCleanup) return DOM.dialogCloseCleanup();
      return closeModal();
    }
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s') {
      e.preventDefault();
      S.versions.unshift({id:'ver_'+Date.now(), ts:new Date().toLocaleString('ru-RU'), author:S.user?.fullName||'Тренер', cells:JSON.parse(JSON.stringify(S.cells))});
      saveLocal(); showToast('Версия сохранена (Ctrl+S)');
    }
    const inInput = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !inInput) {
      if (S.tab==='builder' && S.pitch.history.length) { e.preventDefault(); S.pitch.frames[S.pitch.frameIdx]=S.pitch.history.pop(); saveLocal(); updatePitchUIOnly(); }
      else if (['head','assistant','gk','fitness'].includes(S.tab) && planUndo.length) {
        e.preventDefault(); S.cells=planUndo.pop(); saveLocal(); renderMicrocycle(); showToast('Отменено');
      }
    }
    if (e.key==='?' && !inInput) openModal('Справка', '<p style="font-size:13px;">Ctrl+S — сохранить версию • Ctrl+Z — отмена на доске или в плане • Esc — закрыть окно</p>');
  });

  DOM.modal.onclick = (e) => { if(e.target.id==='ui-modal') closeModal(); };
  DOM.dialog.onclick = (e) => { if(e.target.id==='ui-dialog' && DOM.dialogCloseCleanup) DOM.dialogCloseCleanup(); };
  window.addEventListener('online', async () => { showToast('Связь восстановлена'); await flushOfflineQueue(); });
  window.addEventListener('offline', () => setSyncState('offline'));

  function renderAll() {
    applyTheme();
    renderShell();
    if (['head','assistant','gk','fitness'].includes(S.tab)) renderMicrocycle();
    else if (S.tab==='builder') renderBuilder();
    else if (S.tab==='calendar') renderCalendar();
    else if (S.tab==='team') renderTeam();
    else if (S.tab==='admin') {
      if (S.isSuperAdmin) renderAdmin();
      else { S.tab = 'head'; renderMicrocycle(); }
    }
  }

  async function bootstrap() {
    loadOfflineQueue();
    loadLocal();
    renderAll();
    if (!navigator.onLine) setSyncState('offline');
    if (!sb) return;
    let loadedFor = null;
    const onSession = async (sess) => {
      if (!sess?.user) return;
      S.mode = 'cloud';
      S.user = { id:sess.user.id, email:sess.user.email, fullName:sess.user.user_metadata?.full_name || sess.user.email };
      if (loadedFor === sess.user.id) return;
      loadedFor = sess.user.id;
      await loadCloudWorkspace();
      if (navigator.onLine && offlineQueue.length) await flushOfflineQueue();
    };
    sb.auth.onAuthStateChange((ev, sess) => {
      if (ev === 'SIGNED_OUT') { loadedFor = null; return; }
      if (ev === 'PASSWORD_RECOVERY') {
        setTimeout(async () => {
          const np = await uiPrompt('Введите новый пароль (не короче 8 символов):', '', 'Смена пароля', 'password');
          if (!np) return;
          if (np.length < 8) return showToast('Пароль слишком короткий');
          const { error } = await sbCall(sb.auth.updateUser({ password: np }), 'Смена пароля');
          if (!error) showToast('Пароль изменён');
        }, 0);
      }
      setTimeout(() => onSession(sess), 0);
    });
  }

  bootstrap();
})();
</script>
</body>
</html>
